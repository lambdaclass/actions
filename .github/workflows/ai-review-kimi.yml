# Reusable workflow for Kimi (Moonshot AI) code review
# Usage: See examples/ai-review-caller.yml

name: Kimi Code Review

on:
  workflow_call:
    inputs:
      model:
        description: 'Kimi model to use'
        required: false
        type: string
        default: 'kimi-k2.5'
      prompt:
        description: 'Custom review prompt (overrides prompt file if provided)'
        required: false
        type: string
        default: ''
    secrets:
      KIMI_API_KEY:
        description: 'Moonshot AI API key'
        required: true

jobs:
  review:
    # For pull_request: only run on same-repo PRs (not forks)
    # For issue_comment: only allow users with write access (OWNER, MEMBER, COLLABORATOR)
    if: |
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request && startsWith(github.event.comment.body, '/kimi') && contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: ${{ github.event.pull_request.head.sha || format('refs/pull/{0}/head', github.event.issue.number) }}

      - name: Load prompt
        id: prompt
        env:
          INPUT_PROMPT: ${{ inputs.prompt }}
        run: |
          if [ -n "$INPUT_PROMPT" ]; then
            cat << 'PROMPT_EOF' > /tmp/prompt.txt
          ${{ inputs.prompt }}
          PROMPT_EOF
            echo "source=input" >> $GITHUB_OUTPUT
          elif [ -f ".github/prompts/ai-review.md" ]; then
            cat .github/prompts/ai-review.md > /tmp/prompt.txt
            echo "source=custom" >> $GITHUB_OUTPUT
          else
            cat << 'PROMPT_EOF' > /tmp/prompt.txt
          You are a code reviewer. Review ONLY the changes in the pull request diff, not the entire codebase.

          Focus on:
          1. **Security vulnerabilities** - Label by criticality (Critical/High/Medium/Low)
          2. **Bugs** - Logic errors, edge cases, incorrect behavior
          3. **Significant performance issues** - Only flag obvious problems

          Guidelines:
          - Be concise and actionable
          - Reference specific file names and line numbers
          - Only flag real issues, not style preferences
          - If no issues found, say so briefly
          PROMPT_EOF
            echo "source=default" >> $GITHUB_OUTPUT
          fi
          echo "content<<EOF" >> $GITHUB_OUTPUT
          cat /tmp/prompt.txt >> $GITHUB_OUTPUT
          echo "" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Get PR diff
        id: diff
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
        run: |
          gh pr diff "$PR_NUMBER" --repo "${{ github.repository }}" > /tmp/pr_diff.txt
          echo "Diff has $(wc -l < /tmp/pr_diff.txt) lines"

      - name: Install opencode
        env:
          OPENCODE_VERSION: '1.15.13'
          OPENCODE_SHA256: '51785a07c009f27c5125a5235c5a0ff78433dace07f73fbc44eb672ead4b3d79'
        run: |
          url="https://github.com/anomalyco/opencode/releases/download/v${OPENCODE_VERSION}/opencode-linux-x64.tar.gz"
          curl -fsSL "$url" -o /tmp/opencode.tar.gz
          echo "${OPENCODE_SHA256}  /tmp/opencode.tar.gz" | sha256sum -c -
          mkdir -p "$HOME/.opencode/bin"
          tar -xzf /tmp/opencode.tar.gz -C "$HOME/.opencode/bin"
          chmod 755 "$HOME/.opencode/bin/opencode"
          echo "$HOME/.opencode/bin" >> "$GITHUB_PATH"

      - name: Run Kimi Code Review
        id: kimi-review
        # No GITHUB_TOKEN here: the agent emits, the next step posts.
        env:
          MOONSHOT_API_KEY: ${{ secrets.KIMI_API_KEY }}
          MODEL: ${{ inputs.model }}
          PROMPT_CONTENT: ${{ steps.prompt.outputs.content }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
        run: |
          mkdir -p .opencode
          cat > opencode.json << 'OPENCODE_EOF'
          {
            "$schema": "https://opencode.ai/config.json",
            "provider": {
              "moonshotai": {
                "npm": "@ai-sdk/openai-compatible",
                "name": "Moonshot AI",
                "options": { "baseURL": "https://api.moonshot.ai/v1" }
              }
            }
          }
          OPENCODE_EOF

          {
            printf 'REPO: %s\nPR NUMBER: %s\n\n' "$REPO" "$PR_NUMBER"
            printf '%s\n\n' "$PROMPT_CONTENT"
            echo "The PR diff is available at /tmp/pr_diff.txt. Read it with: cat /tmp/pr_diff.txt"
            echo "Output your review findings in markdown. Do NOT post a PR comment yourself - just output the review content."
          } > /tmp/agent_prompt.txt

          set -o pipefail
          opencode run --format json -m "moonshotai/${MODEL}" "$(cat /tmp/agent_prompt.txt)" > /tmp/events.jsonl

          # Each line is {type,timestamp,sessionID,...}; completed assistant text
          # arrives as {"type":"text","part":{"text":"..."}} events.
          jq -rs 'map(select(.type == "text") | .part.text) | join("\n")' /tmp/events.jsonl > /tmp/review.txt

          if [ -s /tmp/review.txt ]; then
            echo "success=true" >> "$GITHUB_OUTPUT"
          else
            echo "error=true" >> "$GITHUB_OUTPUT"
            echo "error_message=opencode produced no review text" >> "$GITHUB_OUTPUT"
          fi

      - name: Post review comment
        if: steps.kimi-review.outputs.success == 'true'
        uses: actions/github-script@v7
        env:
          PROMPT_SOURCE: ${{ steps.prompt.outputs.source }}
          MODEL: ${{ inputs.model }}
        with:
          github-token: ${{ github.token }}
          script: |
            const fs = require('fs');
            const review = fs.readFileSync('/tmp/review.txt', 'utf8');
            const model = process.env.MODEL;
            const source = process.env.PROMPT_SOURCE;
            const promptNote = (source === 'custom' || source === 'input') ? ' · custom prompt' : '';
            if (review && review.trim() !== '') {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request?.number || context.payload.issue?.number,
                body: `## 🤖 Kimi Code Review\n\n${review}\n\n---\n*Automated review by Kimi (Moonshot AI) · ${model}${promptNote}*`,
              });
            }

      - name: Post error comment
        if: steps.kimi-review.outputs.error == 'true'
        uses: actions/github-script@v7
        env:
          ERROR_MESSAGE: ${{ steps.kimi-review.outputs.error_message }}
        with:
          github-token: ${{ github.token }}
          script: |
            const errorMessage = process.env.ERROR_MESSAGE || 'Unknown error';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request?.number || context.payload.issue?.number,
              body: `## 🤖 Kimi Code Review\n\n⚠️ Review failed: ${errorMessage}\n\n---\n*Automated review by Kimi (Moonshot AI)*`,
            });
