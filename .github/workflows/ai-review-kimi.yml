name: Kimi Code Review

on:
  workflow_call:
    inputs:
      model:
        description: 'Kimi model to use'
        required: false
        type: string
        default: 'kimi-k3.1-pro'
      thinking:
        description: >-
          Thinking mode for the model: 'disabled', 'enabled', or '' (the default)
          to omit the field. The K3 models always reason and take
          reasoning_effort instead, so leave it empty for them. kimi-k2.6
          accepts both values and kimi-k2.7-code only 'enabled'; Moonshot
          retires the K2 series at the end of December 2026.
        required: false
        type: string
        default: ''
      reasoning_effort:
        description: >-
          Reasoning effort for the K3 models: 'low', 'high' or 'max' (Moonshot's
          own default), or '' to omit the field. K2 models do not take it, so
          pass '' with them.
        required: false
        type: string
        default: 'high'
      prompt:
        description: 'Custom review prompt (overrides prompt file if provided)'
        required: false
        type: string
        default: ''
      max_diff_lines:
        description: 'Maximum lines of diff to send to API'
        required: false
        type: number
        default: 10000
      max_tokens:
        description: >-
          Maximum tokens for the response. Reasoning counts against it, so a
          thinking model needs far more than the final review takes.
        required: false
        type: number
        default: 65536
      timeout_minutes:
        description: 'Minutes before the review job is cancelled'
        required: false
        type: number
        default: 20
      temperature:
        description: >-
          Sampling temperature as a string, or '' (the default) to omit the
          field and let the model apply its own. Kimi pins this per model:
          kimi-k3 and kimi-k2.7-code are fixed at 1.0, and kimi-k2.6 requires
          1.0 with thinking enabled but 0.6 with it disabled. Any other value
          is a 400, so omitting it is the only value correct for every model.
        required: false
        type: string
        default: ''
    secrets:
      KIMI_API_KEY:
        description: 'Moonshot AI API key'
        required: true

jobs:
  review:
    if: |
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request && (startsWith(github.event.comment.body, '/kimi') || github.event.comment.body == '/review' || startsWith(github.event.comment.body, '/review ') || startsWith(github.event.comment.body, fromJSON('"/review\n"')) || startsWith(github.event.comment.body, fromJSON('"/review\r"'))) && contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association))
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout_minutes }}
    outputs:
      reported: ${{ steps.post_review.outcome == 'success' || steps.post_error.outcome == 'success' }}
    permissions:
      contents: read
      pull-requests: write

    steps:
      # The prompt file comes from the base branch, never the head: a PR could otherwise rewrite the prompt that reviews it.
      - name: Load prompt
        id: load_prompt
        env:
          GH_TOKEN: ${{ github.token }}
          PROMPT: ${{ inputs.prompt }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
        run: |
          if [ -n "$PROMPT" ]; then
            printf '%s\n' "$PROMPT" > /tmp/prompt.txt
            echo "source=input" >> $GITHUB_OUTPUT
            exit 0
          fi

          BASE_SHA=$(gh pr view "$PR_NUMBER" --repo "$REPO" --json baseRefOid --jq .baseRefOid)
          if gh api -H "Accept: application/vnd.github.raw+json" "repos/$REPO/contents/.github/prompts/ai-review.md?ref=$BASE_SHA" > /tmp/prompt.txt 2> /tmp/prompt_error.txt; then
            echo "source=custom" >> $GITHUB_OUTPUT
          elif grep -q "HTTP 404" /tmp/prompt_error.txt; then
            cat << 'PROMPT_EOF' > /tmp/prompt.txt
          You are a code reviewer. Review ONLY the changes in the pull request diff, not the entire codebase.

          Focus on:
          1. **Security vulnerabilities** - Label by criticality (Critical/High/Medium/Low)
          2. **Bugs** - Logic errors, edge cases, incorrect behavior
          3. **Significant performance issues** - Only flag obvious problems

          Guidelines:
          - Be concise and actionable
          - Reference specific file names and line numbers
          - Only flag real issues, not style preferences
          - If no issues found, say so briefly
          PROMPT_EOF
            echo "source=default" >> $GITHUB_OUTPUT
          else
            cat /tmp/prompt_error.txt
            echo "::error::Could not read .github/prompts/ai-review.md from the base branch"
            exit 1
          fi

      - name: Get PR diff
        id: diff
        env:
          GH_TOKEN: ${{ github.token }}
          MAX_LINES: ${{ inputs.max_diff_lines }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
        run: |
          gh pr diff $PR_NUMBER --repo ${{ github.repository }} > /tmp/pr_diff.txt

          if [ ! -s /tmp/pr_diff.txt ]; then
            echo "::error::The PR diff is empty"
            exit 1
          fi

          TOTAL_LINES=$(wc -l < /tmp/pr_diff.txt)

          head -n $MAX_LINES /tmp/pr_diff.txt > /tmp/pr_diff_truncated.txt

          if [ "$TOTAL_LINES" -gt "$MAX_LINES" ]; then
            echo "truncated=true" >> "$GITHUB_OUTPUT"
            echo "total_lines=$TOTAL_LINES" >> "$GITHUB_OUTPUT"
            echo "::warning::Diff truncated from $TOTAL_LINES to $MAX_LINES lines. Some changes were not reviewed."
          else
            echo "truncated=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Call Kimi API for review
        id: kimi_review
        env:
          KIMI_API_KEY: ${{ secrets.KIMI_API_KEY }}
          MODEL: ${{ inputs.model }}
          THINKING: ${{ inputs.thinking }}
          REASONING_EFFORT: ${{ inputs.reasoning_effort }}
          MAX_TOKENS: ${{ inputs.max_tokens }}
          TEMPERATURE: ${{ inputs.temperature }}
        run: |
          SYSTEM_PROMPT=$(cat /tmp/prompt.txt)
          echo "::add-mask::$KIMI_API_KEY"

          if [ -z "$KIMI_API_KEY" ]; then
            echo "error=true" >> $GITHUB_OUTPUT
            echo "error_message=KIMI_API_KEY secret is not set" >> $GITHUB_OUTPUT
            exit 0
          fi

          USER_PROMPT="REPO: ${{ github.repository }}
          PR NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}

          Review this PR diff and provide feedback on any issues found. Be specific about file names and line numbers when possible:"

          jq -n \
            --arg model "$MODEL" \
            --arg system "$SYSTEM_PROMPT" \
            --arg user "$USER_PROMPT" \
            --argjson max_tokens "$MAX_TOKENS" \
            --arg temperature "$TEMPERATURE" \
            --arg thinking "$THINKING" \
            --arg reasoning_effort "$REASONING_EFFORT" \
            --rawfile diff /tmp/pr_diff_truncated.txt \
            '{
              model: $model,
              messages: [
                { role: "system", content: $system },
                { role: "user", content: ($user + "\n\nDiff:\n" + $diff) }
              ],
              max_tokens: $max_tokens
            }
            + (if $thinking == "" then {} else { thinking: { type: $thinking } } end)
            + (if $reasoning_effort == "" then {} else { reasoning_effort: $reasoning_effort } end)
            + (if $temperature == "" then {} else { temperature: ($temperature | tonumber) } end)' > /tmp/payload.json

          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST "https://api.moonshot.ai/v1/chat/completions" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $KIMI_API_KEY" \
            -d @/tmp/payload.json) || {
            CURL_EXIT=$?
            echo "error=true" >> $GITHUB_OUTPUT
            echo "error_message=Kimi API request failed: curl exit code $CURL_EXIT" >> $GITHUB_OUTPUT
            exit 0
          }

          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | sed '$d')

          if [ "$HTTP_CODE" != "200" ]; then
            # Newlines would end the GITHUB_OUTPUT line and let the response set further outputs.
            ERROR_DETAIL=$(echo "$BODY" | jq -r '.error.message // .error // .' 2>/dev/null | tr '\n' ' ' | head -c 500)
            echo "error=true" >> $GITHUB_OUTPUT
            echo "error_message=Kimi API request failed with status $HTTP_CODE: $ERROR_DETAIL" >> $GITHUB_OUTPUT
            exit 0
          fi

          HAS_ERROR=$(echo "$BODY" | jq -e '.error.message' > /dev/null 2>&1 && echo "yes" || echo "no")
          if [ "$HAS_ERROR" = "yes" ]; then
            echo "error=true" >> $GITHUB_OUTPUT
            echo "error_message=Kimi API returned an error response" >> $GITHUB_OUTPUT
            exit 0
          fi

          REVIEW=$(echo "$BODY" | jq -r '.choices[0].message.content // ""')

          if [ -z "$(printf '%s' "$REVIEW" | tr -d '[:space:]')" ]; then
            FINISH=$(echo "$BODY" | jq -r '.choices[0].finish_reason // "unknown"' | tr -d '\n\r')
            HAS_REASONING=$(echo "$BODY" | jq -r 'if (.choices[0].message.reasoning_content // "") == "" then "no" else "yes" end')
            echo "error=true" >> $GITHUB_OUTPUT
            echo "error_message=Kimi returned an empty content field (finish_reason=$FINISH, reasoning_content present=$HAS_REASONING). If the model reasons, raise max_tokens or lower reasoning_effort; on a K2 model, set the thinking input to 'disabled'." >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "$REVIEW" > /tmp/review.txt
          echo "success=true" >> $GITHUB_OUTPUT

      - name: Post review comment
        id: post_review
        if: steps.kimi_review.outputs.success == 'true'
        uses: actions/github-script@v7
        env:
          TRUNCATED: ${{ steps.diff.outputs.truncated }}
          TOTAL_LINES: ${{ steps.diff.outputs.total_lines }}
          MAX_LINES: ${{ inputs.max_diff_lines }}
          PROMPT_SOURCE: ${{ steps.load_prompt.outputs.source }}
          MODEL: ${{ inputs.model }}
        with:
          script: |
            const fs = require('fs');
            const raw = fs.readFileSync('/tmp/review.txt', 'utf8');
            const limit = 60000;
            const review = raw.length > limit ? raw.slice(0, limit) + "\n\n> Review truncated to fit GitHub's comment size limit." : raw;
            const truncated = process.env.TRUNCATED === 'true';
            const totalLines = process.env.TOTAL_LINES;
            const maxLines = process.env.MAX_LINES;
            const promptSource = process.env.PROMPT_SOURCE;
            const model = process.env.MODEL;

            let truncationWarning = '';
            if (truncated) {
              truncationWarning = `\n> ⚠️ **Warning:** Diff was truncated from ${totalLines} to ${maxLines} lines. Some changes were not reviewed.\n`;
            }

            let promptNote = promptSource === 'custom' ? ' · custom prompt' : '';

            if (review && review.trim() !== '') {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: `## 🤖 Kimi Code Review\n${truncationWarning}\n${review}\n\n---\n*Automated review by Kimi (Moonshot AI) · ${model}${promptNote}*`
              });
            }

      - name: Post error comment
        id: post_error
        if: steps.kimi_review.outputs.error == 'true'
        uses: actions/github-script@v7
        env:
          ERROR_MESSAGE: ${{ steps.kimi_review.outputs.error_message }}
        with:
          script: |
            const errorMessage = process.env.ERROR_MESSAGE || 'Unknown error';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `## 🤖 Kimi Code Review\n\n⚠️ Review failed: ${errorMessage}\n\n---\n*Automated review by Kimi (Moonshot AI)*`
            });

      - name: Fail the job if the review did not run
        if: steps.kimi_review.outputs.error == 'true'
        env:
          # Built from an API response: must reach the shell only through env, never interpolated into run.
          ERROR_MESSAGE: ${{ steps.kimi_review.outputs.error_message }}
        run: |
          echo "::error::${ERROR_MESSAGE//%/%25}"
          exit 1

  # always() also runs this when review was skipped (fork PRs, other slash commands), so skipped must be excluded.
  report_failure:
    name: Report review failure
    needs: review
    if: ${{ always() && needs.review.result != 'skipped' && needs.review.outputs.reported != 'true' }}
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: actions/github-script@v7
        env:
          RESULT: ${{ needs.review.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          github-token: ${{ github.token }}
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request?.number || context.payload.issue?.number,
              body: `## 🤖 Kimi Code Review\n\n⚠️ The review job did not complete (result: ${process.env.RESULT}). [See the job log](${process.env.RUN_URL})\n\n---\n*Automated review by Kimi (Moonshot AI)*`,
            });
