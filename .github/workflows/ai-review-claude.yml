name: Claude Code Review

on:
  workflow_call:
    inputs:
      model:
        description: "Claude model ID; the short names 'sonnet', 'opus' and 'haiku' map to the current 5.5 models"
        required: false
        type: string
        default: 'claude-opus-5-5'
      effort:
        description: "'low', 'medium', 'high', 'xhigh' or 'max'; '' omits the field (Opus 5.5 then runs at medium)."
        required: false
        type: string
        default: 'high'
      prompt:
        description: 'Custom review prompt (overrides prompt file if provided)'
        required: false
        type: string
        default: ''
      max_diff_lines:
        description: 'Maximum lines of diff to send to API'
        required: false
        type: number
        default: 10000
      max_diff_bytes:
        description: >-
          Maximum bytes of diff to send to the API, applied after max_diff_lines.
          Claude's tokenizer measured 2.1-2.4 bytes per token on text and code,
          so 1.8 MB stays under the 1M window; dense content such as minified or
          base64 files can still exceed it and fail the review.
        required: false
        type: number
        default: 1800000
      max_tokens:
        description: >-
          Maximum tokens for the response. Thinking counts against it, so the
          model needs far more than the final review takes.
        required: false
        type: number
        default: 64000
      timeout_minutes:
        description: 'Minutes before the review job is cancelled'
        required: false
        type: number
        default: 20
      exclude_paths:
        description: >-
          Extra glob pathspecs to leave out of the reviewed diff, one per line,
          e.g. 'research/**'. They add to the built-in list: lockfiles, minified
          and source-map files, vendor, node_modules, dist and build trees, data
          files, images and PDFs.
        required: false
        type: string
        default: ''
      max_auto_review_lines:
        description: >-
          Changed lines, added plus deleted after the exclusions, above which an
          automatic pull_request run posts a notice instead of a review. A
          /review comment still reviews the PR. 0 turns the limit off.
        required: false
        type: number
        default: 15000
      price_per_mtok:
        description: >-
          'input/output' USD per million tokens for the cost estimate in the
          comment footer, e.g. '4/20'. '' uses the built-in price of the default
          model; with any other model the footer shows token counts only.
        required: false
        type: string
        default: ''
    secrets:
      ANTHROPIC_API_KEY:
        description: 'Anthropic API key'
        required: true

jobs:
  review:
    if: |
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.draft == false && github.event.pull_request.user.login != 'dependabot[bot]' &&
      github.actor != 'dependabot[bot]') ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request && (startsWith(github.event.comment.body, '/claude') || startsWith(github.event.comment.body, '/review')) && contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association))
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout_minutes }}
    outputs:
      reported: ${{ steps.post_review.outcome == 'success' || steps.post_error.outcome == 'success' || steps.post_skip.outcome == 'success' }}
    permissions:
      contents: read
      pull-requests: write

    steps:
      # The prompt file comes from the base branch, never the head: a PR could otherwise rewrite the prompt that reviews it.
      - name: Load prompt
        id: load_prompt
        env:
          GH_TOKEN: ${{ github.token }}
          PROMPT: ${{ inputs.prompt }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
        run: |
          if [ -n "$PROMPT" ]; then
            printf '%s\n' "$PROMPT" > /tmp/prompt.txt
            echo "source=input" >> $GITHUB_OUTPUT
            exit 0
          fi

          BASE_SHA=$(gh pr view "$PR_NUMBER" --repo "$REPO" --json baseRefOid --jq .baseRefOid)
          if gh api -H "Accept: application/vnd.github.raw+json" "repos/$REPO/contents/.github/prompts/ai-review.md?ref=$BASE_SHA" > /tmp/prompt.txt 2> /tmp/prompt_error.txt; then
            echo "source=custom" >> $GITHUB_OUTPUT
          elif grep -q "HTTP 404" /tmp/prompt_error.txt; then
            cat << 'PROMPT_EOF' > /tmp/prompt.txt
          You are a security reviewer. Review ONLY the changes in the pull request diff, not the entire codebase.

          Report only security issues that this diff introduces or exposes:
          - Injection: SQL, command, template, header and code injection, XSS
          - Authentication and authorization: missing or bypassable checks, privilege escalation, broken tenant or ownership scoping
          - Secrets: credentials, keys or tokens committed, logged or exposed to clients
          - Cryptography: weak or misused primitives, predictable randomness, missing signature or MAC verification
          - Unsafe deserialization, SSRF, path traversal, open redirects, unsafe file handling
          - Dependencies: new or changed packages that are unpinned, unmaintained, typosquatted or known to be vulnerable
          - Smart contracts: reentrancy, access control, unchecked external calls, oracle or price manipulation
          - Race conditions, integer overflows and unvalidated input with a security impact
          - CI and infrastructure: workflow injection, over-broad permissions or tokens, services exposed publicly

          Guidelines:
          - Label each finding Critical, High, Medium or Low and give the file and line
          - Say in a few lines how it could be exploited and how to fix it
          - Do not comment on style, naming, general bugs, performance or tests unless they have a security impact
          - If there are no security issues, say so in one sentence
          PROMPT_EOF
            echo "source=default" >> $GITHUB_OUTPUT
          else
            cat /tmp/prompt_error.txt
            echo "::error::Could not read .github/prompts/ai-review.md from the base branch"
            exit 1
          fi

      # gh pr diff reads the pulls API, which refuses diffs over 20000 lines; git has no cap.
      - name: Get PR diff
        id: diff
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          MAX_LINES: ${{ inputs.max_diff_lines }}
          EXCLUDE_PATHS: ${{ inputs.exclude_paths }}
          MAX_AUTO_LINES: ${{ inputs.max_auto_review_lines }}
          EVENT_NAME: ${{ github.event_name }}
          MAX_BYTES: ${{ inputs.max_diff_bytes }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
        run: |
          SHAS=$(gh pr view "$PR_NUMBER" --repo "$REPO" --json baseRefOid,headRefOid --jq '.baseRefOid + " " + .headRefOid')
          BASE_SHA=${SHAS% *}
          HEAD_SHA=${SHAS#* }
          MERGE_BASE=$(gh api "repos/$REPO/compare/$BASE_SHA...$HEAD_SHA" --jq '.merge_base_commit.sha // empty')
          if [ -z "$MERGE_BASE" ]; then
            echo "::error::No merge base between $BASE_SHA and $HEAD_SHA"
            exit 1
          fi
          PR_REPO=$(mktemp -d)
          export GIT_TERMINAL_PROMPT=0
          git init -q "$PR_REPO"
          git -C "$PR_REPO" remote add origin "$GITHUB_SERVER_URL/$REPO.git"
          git -C "$PR_REPO" config credential.helper '!gh auth git-credential'
          git -C "$PR_REPO" fetch -q --filter=blob:none --depth=1 origin "$MERGE_BASE" "$HEAD_SHA"
          PATHSPECS=(.)
          for p in '*.lock' package-lock.json npm-shrinkwrap.json pnpm-lock.yaml yarn.lock go.sum \
            '*.min.js' '*.min.css' '*.map' 'vendor/**' 'node_modules/**' 'dist/**' 'build/**' \
            '*.csv' '*.tsv' '*.parquet' '*.ipynb' \
            '*.png' '*.jpg' '*.jpeg' '*.gif' '*.webp' '*.ico' '*.pdf'; do
            PATHSPECS+=(":(exclude,glob)**/$p")
          done
          while IFS= read -r p; do
            p=$(printf '%s' "$p" | tr -d '\r' | sed 's/^[[:space:]]*//; s/[[:space:]]*$//')
            if [ -n "$p" ]; then
              PATHSPECS+=(":(exclude,glob)$p")
            fi
          done <<< "$EXCLUDE_PATHS"

          ALL_FILES=$(git -C "$PR_REPO" diff --name-only "$MERGE_BASE" "$HEAD_SHA" | wc -l)
          git -C "$PR_REPO" diff "$MERGE_BASE" "$HEAD_SHA" -- "${PATHSPECS[@]}" > /tmp/pr_diff.txt
          CHANGED_LINES=$(git -C "$PR_REPO" diff --numstat "$MERGE_BASE" "$HEAD_SHA" -- "${PATHSPECS[@]}" | awk '{ n += $1 + $2 } END { print n + 0 }')
          rm -rf "$PR_REPO"

          if [ "$ALL_FILES" -eq 0 ]; then
            echo "::error::The PR diff is empty"
            exit 1
          fi

          echo "changed_lines=$CHANGED_LINES" >> "$GITHUB_OUTPUT"
          if [ ! -s /tmp/pr_diff.txt ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "skip_reason=Every changed file is a lockfile, a generated, vendored or data file, or matches exclude_paths, so there is nothing to review." >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$EVENT_NAME" = pull_request ] && [ "$MAX_AUTO_LINES" -gt 0 ] && [ "$CHANGED_LINES" -gt "$MAX_AUTO_LINES" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "skip_reason=This PR changes $CHANGED_LINES lines, over the $MAX_AUTO_LINES-line limit for automatic reviews. Comment \`/review\` to run them anyway." >> "$GITHUB_OUTPUT"
            exit 0
          fi

          TOTAL_LINES=$(wc -l < /tmp/pr_diff.txt)

          head -n "$MAX_LINES" /tmp/pr_diff.txt > /tmp/pr_diff_lines.txt
          if [ "$(wc -c < /tmp/pr_diff_lines.txt)" -gt "$MAX_BYTES" ]; then
            head -c "$MAX_BYTES" /tmp/pr_diff_lines.txt > /tmp/pr_diff_bytes.txt
            if [ "$(tail -c 1 /tmp/pr_diff_bytes.txt | od -An -c | tr -d ' ')" = '\n' ]; then
              mv /tmp/pr_diff_bytes.txt /tmp/pr_diff_truncated.txt
            else
              sed '$d' /tmp/pr_diff_bytes.txt > /tmp/pr_diff_truncated.txt
            fi
          else
            cp /tmp/pr_diff_lines.txt /tmp/pr_diff_truncated.txt
          fi

          if [ ! -s /tmp/pr_diff_truncated.txt ]; then
            echo "::error::The diff is empty after truncation; raise max_diff_lines or max_diff_bytes"
            exit 1
          fi

          SENT_LINES=$(wc -l < /tmp/pr_diff_truncated.txt)

          if [ "$SENT_LINES" -lt "$TOTAL_LINES" ]; then
            echo "truncated=true" >> "$GITHUB_OUTPUT"
            echo "total_lines=$TOTAL_LINES" >> "$GITHUB_OUTPUT"
            echo "sent_lines=$SENT_LINES" >> "$GITHUB_OUTPUT"
            echo "::warning::Diff truncated from $TOTAL_LINES to $SENT_LINES lines. Some changes were not reviewed."
          else
            echo "truncated=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Call Claude API for review
        id: claude_review
        if: steps.diff.outputs.skip != 'true'
        env:
          PRICE_PER_MTOK: ${{ inputs.price_per_mtok }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MODEL: ${{ inputs.model }}
          EFFORT: ${{ inputs.effort }}
          MAX_TOKENS: ${{ inputs.max_tokens }}
          TIMEOUT_MINUTES: ${{ inputs.timeout_minutes }}
        run: |
          SYSTEM_PROMPT=$(cat /tmp/prompt.txt)
          case "$MODEL" in
            sonnet) MODEL=claude-sonnet-5-5 ;;
            opus) MODEL=claude-opus-5-5 ;;
            haiku) MODEL=claude-haiku-5-5 ;;
          esac
          CURL_MAX_TIME=$(( TIMEOUT_MINUTES * 60 - 330 ))
          if [ "$CURL_MAX_TIME" -lt 60 ]; then
            CURL_MAX_TIME=60
          fi
          echo "::add-mask::$ANTHROPIC_API_KEY"

          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "error=true" >> $GITHUB_OUTPUT
            echo "error_message=ANTHROPIC_API_KEY secret is not set" >> $GITHUB_OUTPUT
            exit 0
          fi

          USER_PROMPT="REPO: ${{ github.repository }}
          PR NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}

          Review this PR diff. You only have the diff below: you have no tools and cannot open other files, so review what it shows and do not describe steps you would take. Lockfiles, generated, vendored and data files were left out of it. Be specific about file names and line numbers:"

          jq -n \
            --arg model "$MODEL" \
            --arg system "$SYSTEM_PROMPT" \
            --arg user "$USER_PROMPT" \
            --argjson max_tokens "$MAX_TOKENS" \
            --arg effort "$EFFORT" \
            --rawfile diff /tmp/pr_diff_truncated.txt \
            '{
              model: $model,
              system: $system,
              messages: [
                { role: "user", content: ($user + "\n\nDiff:\n" + $diff) }
              ],
              max_tokens: $max_tokens,
              fallbacks: "default"
            }
            + (if $effort == "" then {} else { output_config: { effort: $effort } } end)' > /tmp/payload.json

          HTTP_CODE=$(curl -s -o /tmp/response.json -w "%{http_code}" --max-time "$CURL_MAX_TIME" --retry 2 --retry-delay 30 --retry-max-time 120 -X POST "https://api.anthropic.com/v1/messages" \
            -H "Content-Type: application/json" \
            -H "x-api-key: $ANTHROPIC_API_KEY" \
            -H "anthropic-version: 2026-10-21" \
            -H "anthropic-beta: server-side-fallback-2026-07-01" \
            -d @/tmp/payload.json) || {
            CURL_EXIT=$?
            echo "error=true" >> $GITHUB_OUTPUT
            echo "error_message=Claude API request failed: curl exit code $CURL_EXIT" >> $GITHUB_OUTPUT
            exit 0
          }

          BODY=$(cat /tmp/response.json 2> /dev/null || true)

          if [ "$HTTP_CODE" != "200" ]; then
            # Newlines would end the GITHUB_OUTPUT line and let the response set further outputs.
            ERROR_DETAIL=$({ echo "$BODY" | jq -r '.error.message // .error // .' 2> /dev/null || echo "$BODY"; } | tr '\r\n' '  ' | head -c 500 || true)
            echo "error=true" >> $GITHUB_OUTPUT
            echo "error_message=Claude API request failed with status $HTTP_CODE: $ERROR_DETAIL" >> $GITHUB_OUTPUT
            exit 0
          fi

          read -r IN_TOKENS OUT_TOKENS < <(printf '%s' "$BODY" | jq -r '[((.usage.input_tokens // 0) + (.usage.cache_creation_input_tokens // 0) + (.usage.cache_read_input_tokens // 0)), (.usage.output_tokens // 0)] | map(tonumber? // 0 | floor) | @tsv' 2> /dev/null || echo "0 0")
          PRICE="$PRICE_PER_MTOK"
          if [ -z "$PRICE" ]; then
            case "$MODEL" in
              claude-opus-5-5) PRICE=4/20 ;;
            esac
          fi
          COST=""
          if [[ "$PRICE" =~ ^[0-9.]+/[0-9.]+$ ]]; then
            COST=$(awk -v i="${IN_TOKENS:-0}" -v o="${OUT_TOKENS:-0}" -v p="$PRICE" 'BEGIN { split(p, a, "/"); printf "%.4f", (i * a[1] + o * a[2]) / 1000000 }')
          fi
          echo "in_tokens=${IN_TOKENS:-0}" >> $GITHUB_OUTPUT
          echo "out_tokens=${OUT_TOKENS:-0}" >> $GITHUB_OUTPUT
          echo "cost=$COST" >> $GITHUB_OUTPUT

          STOP_REASON=$(echo "$BODY" | jq -r '.stop_reason // "unknown"' | tr -d '\n\r')
          if [ "$STOP_REASON" != "end_turn" ]; then
            CATEGORY=$(echo "$BODY" | jq -r '.stop_details.category // "none"' | tr -d '\n\r' | head -c 100)
            echo "error=true" >> $GITHUB_OUTPUT
            echo "error_message=Claude did not finish the review (stop_reason=$STOP_REASON, category=$CATEGORY). For max_tokens, raise max_tokens or lower effort." >> $GITHUB_OUTPUT
            exit 0
          fi

          REVIEW=$(echo "$BODY" | jq -r '[.content[]? | select(.type == "text") | .text] | join("\n")')

          if [ -z "$(printf '%s' "$REVIEW" | tr -d '[:space:]')" ]; then
            echo "error=true" >> $GITHUB_OUTPUT
            echo "error_message=Claude returned no text (stop_reason=$STOP_REASON)" >> $GITHUB_OUTPUT
            exit 0
          fi

          printf '%s\n' "$REVIEW" > /tmp/review.txt
          echo "model=$(echo "$BODY" | jq -r --arg m "$MODEL" '.model // $m' | tr -d '\n\r' | head -c 100)" >> $GITHUB_OUTPUT
          echo "success=true" >> $GITHUB_OUTPUT

      # Every reviewer reaches the same skip; staggered starts let the first one post the notice and the rest find it.
      - name: Post skip notice
        id: post_skip
        if: steps.diff.outputs.skip == 'true'
        uses: actions/github-script@v7
        env:
          SKIP_REASON: ${{ steps.diff.outputs.skip_reason }}
        with:
          script: |
            await new Promise((resolve) => setTimeout(resolve, 0));
            const key = context.payload.pull_request?.head?.sha || `comment-${context.payload.comment?.id}`;
            const marker = `<!-- ai-review-skip:${key} -->`;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            if (comments.some((c) => (c.body || '').includes(marker))) {
              core.info('Another reviewer already posted the notice');
              return;
            }
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `## 🤖 AI Code Review\n\n${process.env.SKIP_REASON}\n\n---\n*Automated reviews not run (first reported by Claude)*\n${marker}`
            });

      - name: Post review comment
        id: post_review
        if: steps.claude_review.outputs.success == 'true'
        uses: actions/github-script@v7
        env:
          IN_TOKENS: ${{ steps.claude_review.outputs.in_tokens }}
          OUT_TOKENS: ${{ steps.claude_review.outputs.out_tokens }}
          COST: ${{ steps.claude_review.outputs.cost }}
          TRUNCATED: ${{ steps.diff.outputs.truncated }}
          TOTAL_LINES: ${{ steps.diff.outputs.total_lines }}
          SENT_LINES: ${{ steps.diff.outputs.sent_lines }}
          PROMPT_SOURCE: ${{ steps.load_prompt.outputs.source }}
          MODEL: ${{ steps.claude_review.outputs.model }}
        with:
          script: |
            const fs = require('fs');
            const raw = fs.readFileSync('/tmp/review.txt', 'utf8');
            const limit = 60000;
            const review = raw.length > limit ? raw.slice(0, limit) + "\n\n> Review truncated to fit GitHub's comment size limit." : raw;
            const truncated = process.env.TRUNCATED === 'true';
            const totalLines = process.env.TOTAL_LINES;
            const sentLines = process.env.SENT_LINES;
            const promptSource = process.env.PROMPT_SOURCE;
            const model = process.env.MODEL;

            let truncationWarning = '';
            if (truncated) {
              truncationWarning = `\n> ⚠️ **Warning:** Diff was truncated from ${totalLines} to ${sentLines} lines. Some changes were not reviewed.\n`;
            }

            const fmtTokens = (n) => n >= 1000 ? `${(n / 1000).toFixed(1)}k` : String(n);
            const inTokens = Number(process.env.IN_TOKENS || 0);
            const outTokens = Number(process.env.OUT_TOKENS || 0);
            const cost = process.env.COST ? Number(process.env.COST) : null;
            const usageNote = inTokens || outTokens ? ` · ${fmtTokens(inTokens)} in / ${fmtTokens(outTokens)} out${cost === null ? '' : ` · ~$${cost.toFixed(2)}`}` : '';
            const usageTag = `\n<!-- ai-review-usage ${JSON.stringify({ reviewer: 'claude', model: process.env.MODEL || '', in: inTokens, out: outTokens, usd: cost })} -->`;
            let promptNote = promptSource === 'custom' ? ' · custom prompt' : '';

            if (review && review.trim() !== '') {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: `## 🤖 Claude Code Review\n${truncationWarning}\n${review}\n\n---\n*Automated review by Claude · ${model}${promptNote}${usageNote}*${usageTag}`
              });
            }

      - name: Post error comment
        id: post_error
        if: steps.claude_review.outputs.error == 'true'
        uses: actions/github-script@v7
        env:
          IN_TOKENS: ${{ steps.claude_review.outputs.in_tokens }}
          OUT_TOKENS: ${{ steps.claude_review.outputs.out_tokens }}
          COST: ${{ steps.claude_review.outputs.cost }}
          MODEL: ${{ inputs.model }}
          ERROR_MESSAGE: ${{ steps.claude_review.outputs.error_message }}
        with:
          script: |
            const errorMessage = process.env.ERROR_MESSAGE || 'Unknown error';
            const fmtTokens = (n) => n >= 1000 ? `${(n / 1000).toFixed(1)}k` : String(n);
            const inTokens = Number(process.env.IN_TOKENS || 0);
            const outTokens = Number(process.env.OUT_TOKENS || 0);
            const cost = process.env.COST ? Number(process.env.COST) : null;
            const usageNote = inTokens || outTokens ? ` · ${fmtTokens(inTokens)} in / ${fmtTokens(outTokens)} out${cost === null ? '' : ` · ~$${cost.toFixed(2)}`}` : '';
            const usageTag = `\n<!-- ai-review-usage ${JSON.stringify({ reviewer: 'claude', model: process.env.MODEL || '', in: inTokens, out: outTokens, usd: cost })} -->`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `## 🤖 Claude Code Review\n\n⚠️ Review failed: ${errorMessage}\n\n---\n*Automated review by Claude${usageNote}*${usageTag}`
            });

      - name: Fail the job if the review did not run
        if: steps.claude_review.outputs.error == 'true'
        env:
          # Built from an API response: must reach the shell only through env, never interpolated into run.
          ERROR_MESSAGE: ${{ steps.claude_review.outputs.error_message }}
        run: |
          echo "::error::${ERROR_MESSAGE//%/%25}"
          exit 1

  # always() also runs this when review was skipped (fork PRs, other slash commands), so skipped must be excluded.
  report_failure:
    name: Report review failure
    needs: review
    if: ${{ always() && needs.review.result != 'skipped' && needs.review.outputs.reported != 'true' }}
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: actions/github-script@v7
        env:
          RESULT: ${{ needs.review.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          github-token: ${{ github.token }}
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request?.number || context.payload.issue?.number,
              body: `## 🤖 Claude Code Review\n\n⚠️ The review job did not complete (result: ${process.env.RESULT}). [See the job log](${process.env.RUN_URL})\n\n---\n*Automated review by Claude*`,
            });
