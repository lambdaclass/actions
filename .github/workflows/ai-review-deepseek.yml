name: DeepSeek Code Review

on:
  workflow_call:
    inputs:
      model:
        description: 'DeepSeek model to use: deepseek-v4-pro or deepseek-flash'
        required: false
        type: string
        default: 'deepseek-v4-pro'
      reasoning_effort:
        description: >-
          'none' disables thinking; 'low', 'high' (DeepSeek's own default) or
          'max' enable it at that effort; '' omits the field.
        required: false
        type: string
        default: 'high'
      prompt:
        description: 'Custom review prompt (overrides prompt file if provided)'
        required: false
        type: string
        default: ''
      max_diff_lines:
        description: >-
          Ceiling on the diff size. A larger diff is not sent to the model at
          all: the job posts an error comment and fails. It does not trim.
        required: false
        type: number
        default: 200000
      max_diff_bytes:
        description: >-
          Bytes of diff per request, sized to stay under the model's context
          window at the bytes per token its tokenizer gets on code. A larger diff is split on file, then hunk,
          then line boundaries into parts, each reviewed in its own request and
          comment; a part the model still rejects as too long is split in two
          and retried, at most twice.
        required: false
        type: number
        default: 2400000
      max_tokens:
        description: >-
          Maximum tokens for the response. Reasoning counts against it, so a
          thinking model needs far more than the final review takes.
        required: false
        type: number
        default: 65536
      timeout_minutes:
        description: >-
          Minutes before the review job is cancelled. Parts are reviewed in
          parallel and each request is cut off two minutes before this.
        required: false
        type: number
        default: 20
      temperature:
        description: >-
          Sampling temperature as a string, or '' (the default) to omit the
          field. DeepSeek ignores it in thinking mode, so it only matters with reasoning_effort 'none'.
        required: false
        type: string
        default: ''
    secrets:
      DEEPSEEK_API_KEY:
        description: 'DeepSeek API key'
        required: true

jobs:
  review:
    if: |
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request && startsWith(github.event.comment.body, '/deepseek') && contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association))
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout_minutes }}
    outputs:
      reported: ${{ steps.post_review.outcome == 'success' || steps.post_error.outcome == 'success' }}
    permissions:
      contents: read
      pull-requests: write

    steps:
      # The prompt file comes from the base branch, never the head: a PR could otherwise rewrite the prompt that reviews it.
      - name: Load prompt
        id: load_prompt
        env:
          GH_TOKEN: ${{ github.token }}
          PROMPT: ${{ inputs.prompt }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
        run: |
          if [ -n "$PROMPT" ]; then
            printf '%s\n' "$PROMPT" > /tmp/prompt.txt
            echo "source=input" >> $GITHUB_OUTPUT
            exit 0
          fi

          BASE_SHA=$(gh pr view "$PR_NUMBER" --repo "$REPO" --json baseRefOid --jq .baseRefOid)
          if gh api -H "Accept: application/vnd.github.raw+json" "repos/$REPO/contents/.github/prompts/ai-review.md?ref=$BASE_SHA" > /tmp/prompt.txt 2> /tmp/prompt_error.txt; then
            echo "source=custom" >> $GITHUB_OUTPUT
          elif grep -q "HTTP 404" /tmp/prompt_error.txt; then
            cat << 'PROMPT_EOF' > /tmp/prompt.txt
          You are a code reviewer. Review ONLY the changes in the pull request diff, not the entire codebase.

          Focus on:
          1. **Security vulnerabilities** - Label by criticality (Critical/High/Medium/Low)
          2. **Bugs** - Logic errors, edge cases, incorrect behavior
          3. **Significant performance issues** - Only flag obvious problems

          Guidelines:
          - Be concise and actionable
          - Reference specific file names and line numbers
          - Only flag real issues, not style preferences
          - If no issues found, say so briefly
          PROMPT_EOF
            echo "source=default" >> $GITHUB_OUTPUT
          else
            cat /tmp/prompt_error.txt
            echo "::error::Could not read .github/prompts/ai-review.md from the base branch"
            exit 1
          fi

      - name: Get PR diff
        id: diff
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          MAX_LINES: ${{ inputs.max_diff_lines }}
          MAX_BYTES: ${{ inputs.max_diff_bytes }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
        run: |
          SHAS=$(gh pr view "$PR_NUMBER" --repo "$REPO" --json baseRefOid,headRefOid --jq '.baseRefOid + " " + .headRefOid')
          BASE_SHA=${SHAS% *}
          HEAD_SHA=${SHAS#* }
          MERGE_BASE=$(gh api "repos/$REPO/compare/$BASE_SHA...$HEAD_SHA" --jq '.merge_base_commit.sha // empty')
          if [ -z "$MERGE_BASE" ]; then
            echo "::error::No merge base between $BASE_SHA and $HEAD_SHA"
            exit 1
          fi
          PR_REPO=$(mktemp -d)
          export GIT_TERMINAL_PROMPT=0
          git init -q "$PR_REPO"
          git -C "$PR_REPO" remote add origin "$GITHUB_SERVER_URL/$REPO.git"
          git -C "$PR_REPO" config credential.helper '!gh auth git-credential'
          git -C "$PR_REPO" fetch -q --filter=blob:none --depth=1 origin "$MERGE_BASE" "$HEAD_SHA"
          git -C "$PR_REPO" -c core.quotePath=false diff "$MERGE_BASE" "$HEAD_SHA" > /tmp/pr_diff.txt
          rm -rf "$PR_REPO"

          if [ ! -s /tmp/pr_diff.txt ]; then
            echo "::error::The PR diff is empty"
            exit 1
          fi

          TOTAL_LINES=$(wc -l < /tmp/pr_diff.txt | tr -d ' ')
          TOTAL_BYTES=$(wc -c < /tmp/pr_diff.txt | tr -d ' ')
          FILES=$(grep -c '^diff --git ' /tmp/pr_diff.txt || true)
          {
            echo "total_lines=$TOTAL_LINES"
            echo "total_bytes=$TOTAL_BYTES"
            echo "files=$FILES"
          } >> "$GITHUB_OUTPUT"

          if [ "$TOTAL_LINES" -gt "$MAX_LINES" ]; then
            MESSAGE="The diff has $TOTAL_LINES lines over $FILES files, above the max_diff_lines ceiling of $MAX_LINES, so nothing was sent to the model. Raise max_diff_lines in the caller to review this PR."
            echo "::error::$MESSAGE"
            echo "error=true" >> "$GITHUB_OUTPUT"
            echo "error_message=$MESSAGE" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          cat > /tmp/chunk.py <<'PY'
          import json
          import os
          import sys

          budget = int(sys.argv[1])
          src, out_dir, prefix = sys.argv[2], sys.argv[3], sys.argv[4]
          inherited = sys.argv[5] if len(sys.argv) > 5 else ""

          data = open(src, "rb").read()


          def split_lines(b):
              lines, i = [], 0
              while i < len(b):
                  j = b.find(b"\n", i)
                  if j == -1:
                      lines.append(b[i:])
                      break
                  lines.append(b[i:j + 1])
                  i = j + 1
              return lines


          def path_of(header):
              text = header.rstrip(b"\n").decode("utf-8", "replace")
              k = text.rfind(" b/")
              return text[k + 3:] if k != -1 else text[len("diff --git "):]


          files = []
          for line in split_lines(data):
              if line.startswith(b"diff --git ") or not files:
                  path = path_of(line) if line.startswith(b"diff --git ") else inherited
                  files.append((path, []))
              files[-1][1].append(line)

          parts = []
          cur = {"chunks": [], "size": 0, "paths": [], "mid": ""}
          warned = False


          def close():
              global cur
              if cur["chunks"]:
                  parts.append(cur)
              cur = {"chunks": [], "size": 0, "paths": [], "mid": ""}


          def append(chunk, path):
              if not cur["chunks"] and not chunk.startswith(b"diff --git "):
                  cur["mid"] = path
              cur["chunks"].append(chunk)
              cur["size"] += len(chunk)
              if not cur["paths"] or cur["paths"][-1] != path:
                  cur["paths"].append(path)


          def subunits(lines, level):
              if level == 0:
                  groups, seen_hunk = [[]], False
                  for line in lines:
                      if line.startswith(b"@@ "):
                          if seen_hunk:
                              groups.append([])
                          seen_hunk = True
                      groups[-1].append(line)
                  return groups
              units = []
              for line in lines:
                  if line.startswith(b"\\") and units:
                      units[-1].append(line)
                  else:
                      units.append([line])
              return units


          def cut_bytes(chunk, path):
              global warned
              if not warned:
                  print(f"::warning::A single line of {path} is larger than {budget} bytes; it is cut across parts")
                  warned = True
              i = 0
              while i < len(chunk):
                  room = budget - cur["size"]
                  if room <= 0:
                      close()
                      room = budget
                  end = min(i + room, len(chunk))
                  while end < len(chunk) and end > i and (chunk[end] & 0xC0) == 0x80:
                      end -= 1
                  if end == i:
                      close()
                      continue
                  append(chunk[i:end], path)
                  i = end


          def place(lines, level, path):
              chunk = b"".join(lines)
              if cur["size"] + len(chunk) <= budget:
                  append(chunk, path)
                  return
              if len(chunk) <= budget:
                  close()
                  append(chunk, path)
                  return
              if level >= 2:
                  cut_bytes(chunk, path)
                  return
              subs = subunits(lines, level)
              if len(subs) == 1 and level == 0:
                  subs = subunits(lines, 1)
                  level = 1
              if len(subs) == 1:
                  cut_bytes(chunk, path)
                  return
              for sub in subs:
                  place(sub, level + 1, path)


          for path, lines in files:
              place(lines, 0, path)
          close()

          assert b"".join(c for p in parts for c in p["chunks"]) == data, "parts do not concatenate to the input"
          assert all(p["size"] <= budget for p in parts), "a part is over budget"

          os.makedirs(out_dir, exist_ok=True)
          for idx, p in enumerate(parts, 1):
              body = b"".join(p["chunks"])
              name = os.path.join(out_dir, f"{prefix}{idx:03d}")
              with open(name + ".diff", "wb") as f:
                  f.write(body)
              meta = {
                  "files": len(p["paths"]),
                  "lines": body.count(b"\n"),
                  "bytes": len(body),
                  "first_file": p["paths"][0],
                  "last_file": p["paths"][-1],
                  "mid_file_path": p["mid"],
              }
              with open(name + ".meta", "w") as f:
                  json.dump(meta, f)
          PY
          python3 /tmp/chunk.py "$MAX_BYTES" /tmp/pr_diff.txt /tmp/parts "" ""
          if ! cat /tmp/parts/*.diff | cmp -s - /tmp/pr_diff.txt; then
            echo "::error::The diff parts do not add up to the diff"
            exit 1
          fi
          PARTS=$(find /tmp/parts -name '*.diff' | wc -l | tr -d ' ')
          echo "parts=$PARTS" >> "$GITHUB_OUTPUT"
          echo "Diff: $TOTAL_LINES lines, $TOTAL_BYTES bytes, $FILES files, $PARTS part(s) of at most $MAX_BYTES bytes"

      - name: Call DeepSeek API for review
        id: review
        if: steps.diff.outputs.error != 'true'
        env:
          API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
          TIMEOUT_MINUTES: ${{ inputs.timeout_minutes }}
          MODEL: ${{ inputs.model }}
          REASONING_EFFORT: ${{ inputs.reasoning_effort }}
          MAX_TOKENS: ${{ inputs.max_tokens }}
          TEMPERATURE: ${{ inputs.temperature }}
        run: |
          set +e
          echo "::add-mask::$API_KEY"

          if [ -z "$API_KEY" ]; then
            echo "error=true" >> "$GITHUB_OUTPUT"
            echo "error_message=DEEPSEEK_API_KEY secret is not set" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          CURL_MAX_TIME=$(( TIMEOUT_MINUTES * 60 - 120 ))
          if [ "$CURL_MAX_TIME" -lt 60 ]; then
            CURL_MAX_TIME=60
          fi
          OVERFLOW_RE='input_too_large|context_length|context window|maximum context length|token limit|input token|prompt is too long|too (large|long)|exceed.*token|token.*exceed'

          one_line() { tr '\n\r' '  ' | sed 's/ *$//' | head -c "${1:-500}"; }
          blank() { [ -z "$(tr -d '[:space:]' < "$1" 2> /dev/null)" ]; }
          error_detail() {
            jq -r 'if (.error | type) == "object" then (.error.message // (.error | tojson)) else (.error // .) end' "$1" 2> /dev/null | one_line
          }

          build_payload() {
            jq -n \
              --arg model "$MODEL" \
              --rawfile system /tmp/prompt.txt \
              --rawfile user "$2" \
              --rawfile diff "$1" \
              --argjson max_tokens "$MAX_TOKENS" \
              --arg temperature "$TEMPERATURE" \
              --arg reasoning_effort "$REASONING_EFFORT" \
              '{
                model: $model,
                messages: [
                  { role: "system", content: $system },
                  { role: "user", content: ($user + "\n\nDiff:\n" + $diff) }
                ],
                max_tokens: $max_tokens
              }
              + (if $reasoning_effort == "" then {} else { reasoning_effort: $reasoning_effort } end)
              + (if $temperature == "" then {} else { temperature: ($temperature | tonumber) } end)'
          }

          call_api() {
            curl -sS -o "$1.resp" -D "$1.headers" -w '%{http_code}' --max-time "$CURL_MAX_TIME" \
              -X POST "https://api.deepseek.com/chat/completions" \
              -H "Content-Type: application/json" \
              -H "Authorization: Bearer $API_KEY" \
              -d @"$1.payload"
          }

          parse_response() {
            local d=$1
            if jq -e '.error.message' "$d.resp" > /dev/null 2>&1; then
              echo "DeepSeek API returned an error response: $(error_detail "$d.resp")" > "$d.error"
              return
            fi
            jq -r '.choices[0].message.content // ""' "$d.resp" > "$d.review"
            if blank "$d.review"; then
              rm -f "$d.review"
              echo "DeepSeek returned an empty content field (finish_reason=$(jq -r '.choices[0].finish_reason // "unknown"' "$d.resp" | one_line 50), reasoning_content present=$(jq -r 'if (.choices[0].message.reasoning_content // "") == "" then "no" else "yes" end' "$d.resp")). Raise max_tokens or lower reasoning_effort ('none' disables thinking)." > "$d.error"
            fi
          }

          review_part() {
            local name=$1 depth=$2 note=$3 d="/tmp/parts/$1" code rc attempt=0 wait_s start=$SECONDS mid
            mid=$(jq -r '.mid_file_path' "$d.meta")
            {
              printf 'REPO: %s\nPR NUMBER: %s\n\n' "$REPO" "$PR_NUMBER"
              printf '%s' 'Review this PR diff and provide feedback on any issues found. Be specific about file names and line numbers when possible:'
              if [ -n "$note" ]; then
                printf '\n\n%s' "$note"
              fi
              if [ -n "$mid" ]; then
                printf ' It begins inside the diff of %s, continued from the previous part.' "$mid"
              fi
            } > "$d.user"
            if ! build_payload "$d.diff" "$d.user" > "$d.payload"; then
              echo "could not build the request payload" > "$d.error"
              return
            fi
            while :; do
              rc=0
              code=$(call_api "$d") || rc=$?
              if [ "$rc" -eq 0 ] && [[ "$code" =~ ^(429|500|502|503|504|529)$ ]] && [ "$attempt" -lt 3 ]; then
                wait_s=$(grep -i '^retry-after:' "$d.headers" | head -n1 | tr -dc '0-9')
                if [ -z "$wait_s" ]; then
                  wait_s=$(( 30 << attempt ))
                fi
                if [ "$wait_s" -gt 300 ]; then
                  wait_s=300
                fi
                echo "::warning::Part $name: HTTP $code, retrying in ${wait_s}s"
                sleep "$wait_s"
                attempt=$(( attempt + 1 ))
                continue
              fi
              break
            done
            echo $(( SECONDS - start )) > "$d.seconds"
            if [ "$rc" -ne 0 ]; then
              echo "request failed: curl exit code $rc" > "$d.error"
              return
            fi
            if [ "$code" != "200" ]; then
              if [[ "$code" =~ ^(400|413)$ ]] && grep -Eiq "$OVERFLOW_RE" "$d.resp"; then
                split_part "$name" "$depth" "$note"
                return
              fi
              echo "HTTP $code: $(error_detail "$d.resp")" > "$d.error"
              return
            fi
            jq -c '{input: (.usage.input_tokens // .usage.prompt_tokens // .usageMetadata.promptTokenCount), output: (.usage.output_tokens // .usage.completion_tokens // .usageMetadata.candidatesTokenCount)}' "$d.resp" > "$d.usage" 2> /dev/null
            parse_response "$d"
          }

          split_part() {
            local name=$1 depth=$2 note=$3 d="/tmp/parts/$1" size mid n i=0 child sub
            size=$(wc -c < "$d.diff" | tr -d ' ')
            if [ "$depth" -ge 2 ]; then
              echo "still over the model's context window after 2 splits ($size bytes, $(error_detail "$d.resp")). Lower max_diff_bytes." > "$d.error"
              return
            fi
            mid=$(jq -r '.mid_file_path' "$d.meta")
            if ! python3 /tmp/chunk.py $(( size * 11 / 20 + 1 )) "$d.diff" /tmp/parts "$name-" "$mid"; then
              echo "could not split the part after the model rejected it as too long" > "$d.error"
              return
            fi
            n=$(find /tmp/parts -name "$name-???.diff" | wc -l | tr -d ' ')
            echo "::warning::Part $name ($size bytes) is over the model's context window: $(error_detail "$d.resp"). Split into $n and retried."
            rm -f "$d.diff" "$d.meta" "$d.user" "$d.payload" "$d.resp" "$d.headers" "$d.seconds" "$d.usage"
            for child in $(find /tmp/parts -name "$name-???.diff" | sort); do
              i=$(( i + 1 ))
              if [ -n "$note" ]; then
                sub="$note This is sub-part $i of $n of that part, split again to fit the context window of the model."
              else
                sub="This is part $i of $n of the PR diff, split to fit the context window of the model. Review only what is here; the other parts are reviewed separately."
              fi
              review_part "$(basename "$child" .diff)" $(( depth + 1 )) "$sub" &
            done
            wait
          }

          TOP=$(find /tmp/parts -name '*.diff' | sort)
          N=$(echo "$TOP" | wc -l | tr -d ' ')
          i=0
          # Workers write only their own files under /tmp/parts; GITHUB_OUTPUT is written here, after wait.
          for f in $TOP; do
            i=$(( i + 1 ))
            note=""
            if [ "$N" -gt 1 ]; then
              note="This is part $i of $N of the PR diff, split on file boundaries. Review only what is here; the other parts are reviewed separately."
            fi
            review_part "$(basename "$f" .diff)" 0 "$note" &
            sleep 1
          done
          wait

          FAILURES=""
          LEAVES=0
          for f in $(find /tmp/parts -name '*.diff' | sort); do
            name=$(basename "$f" .diff)
            d="/tmp/parts/$name"
            LEAVES=$(( LEAVES + 1 ))
            bytes=$(wc -c < "$f" | tr -d ' ')
            in_t=$(jq -r '.input // empty' "$d.usage" 2> /dev/null)
            out_t=$(jq -r '.output // empty' "$d.usage" 2> /dev/null)
            ratio="?"
            if [ -n "$in_t" ] && [ "$in_t" -gt 0 ] 2> /dev/null; then
              ratio=$(awk -v b="$bytes" -v t="$in_t" 'BEGIN { printf "%.2f", b / t }')
            fi
            echo "Part $name: $bytes bytes, input tokens ${in_t:-?}, bytes/token $ratio, output tokens ${out_t:-?}, $(cat "$d.seconds" 2> /dev/null || echo '?')s"
            if [ -s "$d.error" ]; then
              FAILURES="$FAILURES[$name] $(one_line < "$d.error") "
            elif [ ! -s "$d.review" ]; then
              FAILURES="$FAILURES[$name] no result, the worker exited early "
            fi
          done

          if [ -n "$FAILURES" ]; then
            STOP_TOKEN=$(openssl rand -hex 16)
            for f in $(find /tmp/parts -name '*.review' | sort); do
              echo "::group::Review of part $(basename "$f" .review)"
              echo "::stop-commands::$STOP_TOKEN"
              cat "$f"
              echo "::$STOP_TOKEN::"
              echo "::endgroup::"
            done
            echo "error=true" >> "$GITHUB_OUTPUT"
            echo "error_message=$LEAVES part(s) reviewed, not all succeeded, so no review was posted: $(printf '%s' "$FAILURES" | one_line 900)" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "parts=$LEAVES" >> "$GITHUB_OUTPUT"
          echo "success=true" >> "$GITHUB_OUTPUT"

      - name: Post review comment
        id: post_review
        if: steps.review.outputs.success == 'true'
        uses: actions/github-script@v7
        env:
          REVIEWER: DeepSeek
          PROMPT_SOURCE: ${{ steps.load_prompt.outputs.source }}
          MODEL: ${{ inputs.model }}
        with:
          script: |
            const fs = require('fs');
            const dir = '/tmp/parts';
            const names = fs.readdirSync(dir).filter((f) => f.endsWith('.diff')).map((f) => f.slice(0, -5)).sort();
            const reviewer = process.env.REVIEWER;
            const source = process.env.PROMPT_SOURCE;
            const promptNote = source === 'custom' || source === 'input' ? ' · custom prompt' : '';
            const limit = 60000;

            const splitText = (text, budget) => {
              const out = [];
              let cur = '';
              for (let line of text.split('\n')) {
                while (line.length > budget) {
                  if (cur) {
                    out.push(cur);
                    cur = '';
                  }
                  out.push(line.slice(0, budget));
                  line = line.slice(budget);
                }
                const joined = cur ? `${cur}\n${line}` : line;
                if (joined.length > budget) {
                  out.push(cur);
                  cur = line;
                } else {
                  cur = joined;
                }
              }
              out.push(cur);
              return out;
            };

            for (let i = 0; i < names.length; i++) {
              const base = `${dir}/${names[i]}`;
              const review = fs.readFileSync(`${base}.review`, 'utf8').trimEnd();
              const meta = JSON.parse(fs.readFileSync(`${base}.meta`, 'utf8'));
              const model = fs.existsSync(`${base}.model`) ? fs.readFileSync(`${base}.model`, 'utf8').trim() : process.env.MODEL;
              let partTag = '';
              let note = '';
              if (names.length > 1) {
                partTag = ` (part ${i + 1}/${names.length})`;
                const span = meta.first_file === meta.last_file ? meta.first_file : `${meta.first_file} to ${meta.last_file}`;
                const inside = meta.mid_file_path ? `, starting inside ${meta.mid_file_path}` : '';
                note = `> Part ${i + 1} of ${names.length} of the diff (${meta.lines} lines, ${meta.files} ${meta.files === 1 ? 'file' : 'files'}: ${span}${inside}), split to fit the model's context window. The other parts are reviewed in separate comments.\n\n`;
              }
              const footer = `\n\n---\n*Automated review by ${reviewer} · ${model}${promptNote}*`;
              const pieces = splitText(review, limit - note.length - footer.length - 200);
              for (let j = 0; j < pieces.length; j++) {
                const commentTag = pieces.length > 1 ? ` (comment ${j + 1}/${pieces.length})` : '';
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.issue.number,
                  body: `## 🤖 ${reviewer} Code Review${partTag}${commentTag}\n\n${note}${pieces[j]}${footer}`,
                });
              }
            }

      - name: Post error comment
        id: post_error
        if: steps.diff.outputs.error == 'true' || steps.review.outputs.error == 'true'
        uses: actions/github-script@v7
        env:
          ERROR_MESSAGE: ${{ steps.diff.outputs.error_message || steps.review.outputs.error_message }}
        with:
          script: |
            const errorMessage = process.env.ERROR_MESSAGE || 'Unknown error';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `## 🤖 DeepSeek Code Review\n\n⚠️ Review failed: ${errorMessage}\n\n---\n*Automated review by DeepSeek*`
            });

      - name: Fail the job if the review did not run
        if: steps.diff.outputs.error == 'true' || steps.review.outputs.error == 'true'
        env:
          # Built from an API response: must reach the shell only through env, never interpolated into run.
          ERROR_MESSAGE: ${{ steps.diff.outputs.error_message || steps.review.outputs.error_message }}
        run: |
          echo "::error::${ERROR_MESSAGE//%/%25}"
          exit 1

  # always() also runs this when review was skipped (fork PRs, other slash commands), so skipped must be excluded.
  report_failure:
    name: Report review failure
    needs: review
    if: ${{ always() && needs.review.result != 'skipped' && needs.review.outputs.reported != 'true' }}
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: actions/github-script@v7
        env:
          RESULT: ${{ needs.review.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          github-token: ${{ github.token }}
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request?.number || context.payload.issue?.number,
              body: `## 🤖 DeepSeek Code Review\n\n⚠️ The review job did not complete (result: ${process.env.RESULT}). [See the job log](${process.env.RUN_URL})\n\n---\n*Automated review by DeepSeek*`,
            });
