name: Codex Code Review

on:
  workflow_call:
    inputs:
      prompt:
        description: 'Custom review prompt (overrides prompt file if provided)'
        required: false
        type: string
        default: ''
      model:
        description: 'Codex model to use'
        required: false
        type: string
        default: 'gpt-6.1-sol'
      safety_strategy:
        description: 'Codex safety strategy (drop-sudo, permissive, etc.)'
        required: false
        type: string
        default: 'drop-sudo'
      max_diff_lines:
        description: >-
          Lines of diff written to /tmp/pr_diff.txt. Advisory, not a hard bound:
          the agent has the repo checked out at fetch-depth 0 and can regenerate
          the full diff with git diff. Unlike the kimi input of the same name,
          which is a hard cap on the request payload.
        required: false
        type: number
        default: 10000
      timeout_minutes:
        description: 'Minutes before the review job is cancelled'
        required: false
        type: number
        default: 20
      exclude_paths:
        description: >-
          Extra glob pathspecs to leave out of the reviewed diff, one per line,
          e.g. 'research/**'. They add to the built-in list: lockfiles, minified
          and source-map files, vendor, node_modules, dist and build trees, data
          files, images and PDFs.
        required: false
        type: string
        default: ''
      max_auto_review_lines:
        description: >-
          Changed lines, added plus deleted after the exclusions, above which an
          automatic pull_request run posts a notice instead of a review. A
          /review comment still reviews the PR. 0 turns the limit off.
        required: false
        type: number
        default: 15000
    secrets:
      OPENAI_API_KEY:
        description: 'OpenAI API key'
        required: true

permissions:
  contents: read
  pull-requests: write

jobs:
  codex:
    name: Codex Code Review
    if: |
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.draft == false && github.event.pull_request.user.login != 'dependabot[bot]' &&
      github.actor != 'dependabot[bot]') ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request && (startsWith(github.event.comment.body, '/codex') || startsWith(github.event.comment.body, '/review')) && contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association))
    # ubuntu-latest is 26.04 since 2026-11, where the runner user has no sudo and drop-sudo cannot run.
    runs-on: ubuntu-24.04
    outputs:
      reported: ${{ steps.review.outcome == 'success' || steps.error.outcome == 'success' || steps.post_skip.outcome == 'success' }}
    timeout-minutes: ${{ inputs.timeout_minutes }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || format('refs/pull/{0}/head', github.event.issue.number) }}

      # The prompt file comes from the base branch, never the head: a PR could otherwise rewrite the prompt that reviews it.
      - name: Load prompt
        id: prompt
        env:
          GH_TOKEN: ${{ github.token }}
          PROMPT: ${{ inputs.prompt }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
        run: |
          if [ -n "$PROMPT" ]; then
            echo "source=input" >> $GITHUB_OUTPUT
          else
            BASE_SHA=$(gh pr view "$PR_NUMBER" --repo "$REPO" --json baseRefOid --jq .baseRefOid)
            if PROMPT=$(gh api -H "Accept: application/vnd.github.raw+json" "repos/$REPO/contents/.github/prompts/ai-review.md?ref=$BASE_SHA" 2> /tmp/prompt_error.txt); then
              echo "source=custom" >> $GITHUB_OUTPUT
            elif grep -q "HTTP 404" /tmp/prompt_error.txt; then
              PROMPT="You are a security reviewer. Review ONLY the changes in the pull request diff, not the entire codebase.

          Report only security issues that this diff introduces or exposes:
          - Injection: SQL, command, template, header and code injection, XSS
          - Authentication and authorization: missing or bypassable checks, privilege escalation, broken tenant or ownership scoping
          - Secrets: credentials, keys or tokens committed, logged or exposed to clients
          - Cryptography: weak or misused primitives, predictable randomness, missing signature or MAC verification
          - Unsafe deserialization, SSRF, path traversal, open redirects, unsafe file handling
          - Dependencies: new or changed packages that are unpinned, unmaintained, typosquatted or known to be vulnerable
          - Smart contracts: reentrancy, access control, unchecked external calls, oracle or price manipulation
          - Race conditions, integer overflows and unvalidated input with a security impact
          - CI and infrastructure: workflow injection, over-broad permissions or tokens, services exposed publicly

          Guidelines:
          - Label each finding Critical, High, Medium or Low and give the file and line
          - Say in a few lines how it could be exploited and how to fix it
          - Do not comment on style, naming, general bugs, performance or tests unless they have a security impact
          - If there are no security issues, say so in one sentence"
              echo "source=default" >> $GITHUB_OUTPUT
            else
              cat /tmp/prompt_error.txt
              echo "::error::Could not read .github/prompts/ai-review.md from the base branch"
              exit 1
            fi
          fi
          echo "content<<EOF" >> $GITHUB_OUTPUT
          echo "$PROMPT" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      # gh pr diff reads the pulls API, which refuses diffs over 20000 lines; git has no cap.
      - name: Get PR diff
        id: diff
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          MAX_LINES: ${{ inputs.max_diff_lines }}
          EXCLUDE_PATHS: ${{ inputs.exclude_paths }}
          MAX_AUTO_LINES: ${{ inputs.max_auto_review_lines }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
        run: |
          BASE_SHA=$(gh pr view "$PR_NUMBER" --repo "$REPO" --json baseRefOid --jq .baseRefOid)
          HEAD_SHA=$(gh pr view "$PR_NUMBER" --repo "$REPO" --json headRefOid --jq .headRefOid)
          MERGE_BASE=$(gh api "repos/$REPO/compare/$BASE_SHA...$HEAD_SHA" --jq '.merge_base_commit.sha // empty')
          if [ -z "$MERGE_BASE" ]; then
            echo "::error::No merge base between $BASE_SHA and $HEAD_SHA"
            exit 1
          fi
          PR_REPO=$(mktemp -d)
          export GIT_TERMINAL_PROMPT=0
          git init -q "$PR_REPO"
          git -C "$PR_REPO" remote add origin "$GITHUB_SERVER_URL/$REPO.git"
          git -C "$PR_REPO" config credential.helper '!gh auth git-credential'
          git -C "$PR_REPO" fetch -q --filter=blob:none --depth=1 origin "$MERGE_BASE" "$HEAD_SHA"
          PATHSPECS=(.)
          for p in '*.lock' package-lock.json npm-shrinkwrap.json pnpm-lock.yaml yarn.lock go.sum \
            '*.min.js' '*.min.css' '*.map' 'vendor/**' 'node_modules/**' 'dist/**' 'build/**' \
            '*.csv' '*.tsv' '*.parquet' '*.ipynb' \
            '*.png' '*.jpg' '*.jpeg' '*.gif' '*.webp' '*.ico' '*.pdf'; do
            PATHSPECS+=(":(exclude,glob)**/$p")
          done
          while IFS= read -r p; do
            p=$(printf '%s' "$p" | tr -d '\r' | sed 's/^[[:space:]]*//; s/[[:space:]]*$//')
            if [ -n "$p" ]; then
              PATHSPECS+=(":(exclude,glob)$p")
            fi
          done <<< "$EXCLUDE_PATHS"

          ALL_FILES=$(git -C "$PR_REPO" diff --name-only "$MERGE_BASE" "$HEAD_SHA" | wc -l)
          git -C "$PR_REPO" diff "$MERGE_BASE" "$HEAD_SHA" -- "${PATHSPECS[@]}" > /tmp/pr_diff_full.txt
          CHANGED_LINES=$(git -C "$PR_REPO" diff --numstat "$MERGE_BASE" "$HEAD_SHA" -- "${PATHSPECS[@]}" | awk '{ n += $1 + $2 } END { print n + 0 }')
          rm -rf "$PR_REPO"

          if [ "$ALL_FILES" -eq 0 ]; then
            echo "::error::The PR diff is empty"
            exit 1
          fi

          echo "changed_lines=$CHANGED_LINES" >> "$GITHUB_OUTPUT"
          if [ ! -s /tmp/pr_diff_full.txt ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "skip_reason=Every changed file is a lockfile, a generated, vendored or data file, or matches exclude_paths, so there is nothing to review." >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$EVENT_NAME" = pull_request ] && [ "$MAX_AUTO_LINES" -gt 0 ] && [ "$CHANGED_LINES" -gt "$MAX_AUTO_LINES" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "skip_reason=This PR changes $CHANGED_LINES lines, over the $MAX_AUTO_LINES-line limit for automatic reviews. Comment \`/review\` to run them anyway." >> "$GITHUB_OUTPUT"
            exit 0
          fi

          TOTAL_LINES=$(wc -l < /tmp/pr_diff_full.txt)

          head -n "$MAX_LINES" /tmp/pr_diff_full.txt > /tmp/pr_diff.txt
          rm -f /tmp/pr_diff_full.txt

          if [ "$TOTAL_LINES" -gt "$MAX_LINES" ]; then
            echo "truncated=true" >> "$GITHUB_OUTPUT"
            echo "total_lines=$TOTAL_LINES" >> "$GITHUB_OUTPUT"
            echo "::warning::Diff truncated from $TOTAL_LINES to $MAX_LINES lines. Some changes were not reviewed."
          else
            echo "truncated=false" >> "$GITHUB_OUTPUT"
          fi

          echo "Diff has $TOTAL_LINES lines, sending $(wc -l < /tmp/pr_diff.txt)"

      - name: Run Codex Code Review
        id: codex
        if: steps.diff.outputs.skip != 'true'
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          model: ${{ inputs.model }}
          safety-strategy: ${{ inputs.safety_strategy }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}

            ${{ steps.prompt.outputs.content }}

            The PR diff is available at /tmp/pr_diff.txt. Read it with: cat /tmp/pr_diff.txt

      # Every reviewer reaches the same skip; staggered starts let the first one post the notice and the rest find it.
      - name: Post skip notice
        id: post_skip
        if: steps.diff.outputs.skip == 'true'
        uses: actions/github-script@v7
        env:
          SKIP_REASON: ${{ steps.diff.outputs.skip_reason }}
        with:
          script: |
            await new Promise((resolve) => setTimeout(resolve, 30000));
            const key = context.payload.pull_request?.head?.sha || `comment-${context.payload.comment?.id}`;
            const marker = `<!-- ai-review-skip:${key} -->`;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            if (comments.some((c) => (c.body || '').includes(marker))) {
              core.info('Another reviewer already posted the notice');
              return;
            }
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `## 🤖 AI Code Review\n\n${process.env.SKIP_REASON}\n\n---\n*Automated reviews not run (first reported by Codex)*\n${marker}`
            });

      - name: Post review comment
        id: review
        if: steps.codex.outputs.final-message != ''
        uses: actions/github-script@v7
        env:
          CODEX_FINAL_MESSAGE: ${{ steps.codex.outputs.final-message }}
          PROMPT_SOURCE: ${{ steps.prompt.outputs.source }}
          MODEL: ${{ inputs.model }}
          TRUNCATED: ${{ steps.diff.outputs.truncated }}
          TOTAL_LINES: ${{ steps.diff.outputs.total_lines }}
          MAX_LINES: ${{ inputs.max_diff_lines }}
        with:
          github-token: ${{ github.token }}
          script: |
            const source = process.env.PROMPT_SOURCE;
            const model = process.env.MODEL;
            const promptNote = (source === 'custom' || source === 'input') ? ' · custom prompt' : '';
            const raw = process.env.CODEX_FINAL_MESSAGE;
            const limit = 60000;
            const message = raw.length > limit ? raw.slice(0, limit) + "\n\n> Review truncated to fit GitHub's comment size limit." : raw;
            const truncationWarning = process.env.TRUNCATED === 'true'
              ? `\n> ⚠️ **Warning:** Diff was truncated from ${process.env.TOTAL_LINES} to ${process.env.MAX_LINES} lines. Some changes were not reviewed.\n`
              : '';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request?.number || context.payload.issue?.number,
              body: `## 🤖 Codex Code Review\n${truncationWarning}\n${message}\n\n---\n*Automated review by OpenAI Codex · ${model}${promptNote}*\n<!-- ai-review-usage ${JSON.stringify({ reviewer: 'codex', model, in: 0, out: 0, usd: null })} -->`,
            });

      - name: Post error comment
        id: error
        if: ${{ success() && steps.diff.outputs.skip != 'true' && steps.codex.outputs.final-message == '' }}
        uses: actions/github-script@v7
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          github-token: ${{ github.token }}
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request?.number || context.payload.issue?.number,
              body: `## 🤖 Codex Code Review\n\n⚠️ Review failed: the run produced no final message. [See the job log](${process.env.RUN_URL})\n\n---\n*Automated review by OpenAI Codex*`,
            });

      - name: Fail the job if no review was produced
        if: ${{ success() && steps.diff.outputs.skip != 'true' && steps.codex.outputs.final-message == '' }}
        run: |
          echo "::error::Codex produced no final message"
          exit 1

  # always() also runs this when codex was skipped (fork PRs, /kimi comments), so skipped must be excluded.
  report_failure:
    name: Report review failure
    needs: codex
    if: ${{ always() && needs.codex.result != 'skipped' && needs.codex.outputs.reported != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Post failure comment
        uses: actions/github-script@v7
        env:
          CODEX_RESULT: ${{ needs.codex.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          github-token: ${{ github.token }}
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request?.number || context.payload.issue?.number,
              body: `## 🤖 Codex Code Review\n\n⚠️ The review job did not complete (result: ${process.env.CODEX_RESULT}). [See the job log](${process.env.RUN_URL})\n\n---\n*Automated review by OpenAI Codex*`,
            });
