name: Codex Code Review

on:
  workflow_call:
    inputs:
      prompt:
        description: 'Custom review prompt (overrides prompt file if provided)'
        required: false
        type: string
        default: ''
      model:
        description: 'Codex model to use'
        required: false
        type: string
        default: 'gpt-6.1-sol'
      safety_strategy:
        description: 'Codex safety strategy (drop-sudo, permissive, etc.)'
        required: false
        type: string
        default: 'drop-sudo'
      max_diff_lines:
        description: >-
          Ceiling on the diff size. A larger diff is not reviewed at all: the
          job posts an error comment and fails. Below it, Codex gets the whole
          diff in /tmp/pr_diff.txt.
        required: false
        type: number
        default: 200000
      timeout_minutes:
        description: 'Minutes before the review job is cancelled'
        required: false
        type: number
        default: 20
    secrets:
      OPENAI_API_KEY:
        description: 'OpenAI API key'
        required: true

permissions:
  contents: read
  pull-requests: write

jobs:
  codex:
    name: Codex Code Review
    if: |
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request && startsWith(github.event.comment.body, '/codex') && contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association))
    # ubuntu-latest is 26.04 since 2026-11, where the runner user has no sudo and drop-sudo cannot run.
    runs-on: ubuntu-24.04
    outputs:
      reported: ${{ steps.review.outcome == 'success' || steps.error.outcome == 'success' }}
    timeout-minutes: ${{ inputs.timeout_minutes }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || format('refs/pull/{0}/head', github.event.issue.number) }}

      # The prompt file comes from the base branch, never the head: a PR could otherwise rewrite the prompt that reviews it.
      - name: Load prompt
        id: prompt
        env:
          GH_TOKEN: ${{ github.token }}
          PROMPT: ${{ inputs.prompt }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
        run: |
          if [ -n "$PROMPT" ]; then
            echo "source=input" >> $GITHUB_OUTPUT
          else
            BASE_SHA=$(gh pr view "$PR_NUMBER" --repo "$REPO" --json baseRefOid --jq .baseRefOid)
            if PROMPT=$(gh api -H "Accept: application/vnd.github.raw+json" "repos/$REPO/contents/.github/prompts/ai-review.md?ref=$BASE_SHA" 2> /tmp/prompt_error.txt); then
              echo "source=custom" >> $GITHUB_OUTPUT
            elif grep -q "HTTP 404" /tmp/prompt_error.txt; then
              PROMPT="You are a code reviewer. Review ONLY the changes in this pull request diff, not the entire codebase.

          Focus on:
          1. **Security vulnerabilities** - Label by criticality (Critical/High/Medium/Low)
          2. **Bugs** - Logic errors, edge cases, incorrect behavior
          3. **Significant performance issues** - Only flag obvious problems

          Guidelines:
          - Be concise and actionable
          - Reference specific file names and line numbers
          - Only flag real issues, not style preferences
          - If no issues found, say so briefly"
              echo "source=default" >> $GITHUB_OUTPUT
            else
              cat /tmp/prompt_error.txt
              echo "::error::Could not read .github/prompts/ai-review.md from the base branch"
              exit 1
            fi
          fi
          echo "content<<EOF" >> $GITHUB_OUTPUT
          echo "$PROMPT" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      # gh pr diff reads the pulls API, which refuses diffs over 20000 lines; git has no cap.
      - name: Get PR diff
        id: diff
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          MAX_LINES: ${{ inputs.max_diff_lines }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
        run: |
          SHAS=$(gh pr view "$PR_NUMBER" --repo "$REPO" --json baseRefOid,headRefOid --jq '.baseRefOid + " " + .headRefOid')
          BASE_SHA=${SHAS% *}
          HEAD_SHA=${SHAS#* }
          MERGE_BASE=$(gh api "repos/$REPO/compare/$BASE_SHA...$HEAD_SHA" --jq '.merge_base_commit.sha // empty')
          if [ -z "$MERGE_BASE" ]; then
            echo "::error::No merge base between $BASE_SHA and $HEAD_SHA"
            exit 1
          fi
          PR_REPO=$(mktemp -d)
          export GIT_TERMINAL_PROMPT=0
          git init -q "$PR_REPO"
          git -C "$PR_REPO" remote add origin "$GITHUB_SERVER_URL/$REPO.git"
          git -C "$PR_REPO" config credential.helper '!gh auth git-credential'
          git -C "$PR_REPO" fetch -q --filter=blob:none --depth=1 origin "$MERGE_BASE" "$HEAD_SHA"
          git -C "$PR_REPO" -c core.quotePath=false diff "$MERGE_BASE" "$HEAD_SHA" > /tmp/pr_diff.txt
          rm -rf "$PR_REPO"

          if [ ! -s /tmp/pr_diff.txt ]; then
            echo "::error::The PR diff is empty"
            exit 1
          fi

          TOTAL_LINES=$(wc -l < /tmp/pr_diff.txt | tr -d ' ')
          TOTAL_BYTES=$(wc -c < /tmp/pr_diff.txt | tr -d ' ')
          FILES=$(grep -c '^diff --git ' /tmp/pr_diff.txt || true)
          {
            echo "total_lines=$TOTAL_LINES"
            echo "total_bytes=$TOTAL_BYTES"
            echo "files=$FILES"
          } >> "$GITHUB_OUTPUT"
          echo "Diff: $TOTAL_LINES lines, $TOTAL_BYTES bytes, $FILES files"

          if [ "$TOTAL_LINES" -gt "$MAX_LINES" ]; then
            MESSAGE="The diff has $TOTAL_LINES lines over $FILES files, above the max_diff_lines ceiling of $MAX_LINES, so nothing was sent to the model. Raise max_diff_lines in the caller to review this PR."
            echo "::error::$MESSAGE"
            echo "error=true" >> "$GITHUB_OUTPUT"
            echo "error_message=$MESSAGE" >> "$GITHUB_OUTPUT"
          fi

      - name: Run Codex Code Review
        id: codex
        if: steps.diff.outputs.error != 'true'
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          model: ${{ inputs.model }}
          safety-strategy: ${{ inputs.safety_strategy }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}

            ${{ steps.prompt.outputs.content }}

            The complete PR diff (${{ steps.diff.outputs.total_lines }} lines, ${{ steps.diff.outputs.files }} files, ${{ steps.diff.outputs.total_bytes }} bytes) is at /tmp/pr_diff.txt. Review all of it. Read it in pieces if it is large, for example with sed -n '1,4000p' /tmp/pr_diff.txt.

      - name: Post review comment
        id: review
        if: steps.codex.outputs.final-message != ''
        uses: actions/github-script@v7
        env:
          CODEX_FINAL_MESSAGE: ${{ steps.codex.outputs.final-message }}
          PROMPT_SOURCE: ${{ steps.prompt.outputs.source }}
          MODEL: ${{ inputs.model }}
        with:
          github-token: ${{ github.token }}
          script: |
            const source = process.env.PROMPT_SOURCE;
            const model = process.env.MODEL;
            const promptNote = (source === 'custom' || source === 'input') ? ' · custom prompt' : '';
            const raw = process.env.CODEX_FINAL_MESSAGE;
            const footer = `\n\n---\n*Automated review by OpenAI Codex · ${model}${promptNote}*`;
            const budget = 60000 - footer.length - 200;
            const pieces = [];
            let cur = null;
            for (let line of raw.split('\n')) {
              while (line.length > budget) {
                if (cur !== null) {
                  pieces.push(cur);
                  cur = null;
                }
                pieces.push(line.slice(0, budget));
                line = line.slice(budget);
              }
              if (cur === null) {
                cur = line;
              } else if (cur.length + 1 + line.length > budget) {
                pieces.push(cur);
                cur = line;
              } else {
                cur = `${cur}\n${line}`;
              }
            }
            if (cur !== null) {
              pieces.push(cur);
            }
            for (let j = 0; j < pieces.length; j++) {
              const tag = pieces.length > 1 ? ` (comment ${j + 1}/${pieces.length})` : '';
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request?.number || context.payload.issue?.number,
                body: `## 🤖 Codex Code Review${tag}\n\n${pieces[j]}${footer}`,
              });
            }

      - name: Post error comment
        id: error
        if: ${{ success() && steps.codex.outputs.final-message == '' }}
        uses: actions/github-script@v7
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          DIFF_ERROR: ${{ steps.diff.outputs.error_message }}
        with:
          github-token: ${{ github.token }}
          script: |
            const reason = process.env.DIFF_ERROR || `the run produced no final message. [See the job log](${process.env.RUN_URL})`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request?.number || context.payload.issue?.number,
              body: `## 🤖 Codex Code Review\n\n⚠️ Review failed: ${reason}\n\n---\n*Automated review by OpenAI Codex*`,
            });

      - name: Fail the job if no review was produced
        if: ${{ success() && steps.codex.outputs.final-message == '' }}
        env:
          DIFF_ERROR: ${{ steps.diff.outputs.error_message }}
        run: |
          echo "::error::${DIFF_ERROR:-Codex produced no final message}"
          exit 1

  # always() also runs this when codex was skipped (fork PRs, /kimi comments), so skipped must be excluded.
  report_failure:
    name: Report review failure
    needs: codex
    if: ${{ always() && needs.codex.result != 'skipped' && needs.codex.outputs.reported != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Post failure comment
        uses: actions/github-script@v7
        env:
          CODEX_RESULT: ${{ needs.codex.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          github-token: ${{ github.token }}
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request?.number || context.payload.issue?.number,
              body: `## 🤖 Codex Code Review\n\n⚠️ The review job did not complete (result: ${process.env.CODEX_RESULT}). [See the job log](${process.env.RUN_URL})\n\n---\n*Automated review by OpenAI Codex*`,
            });
