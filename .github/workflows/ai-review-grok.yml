name: Grok Code Review

on:
  workflow_call:
    inputs:
      model:
        description: 'xAI model to use: grok-4.7, grok-build-0.1 or grok-4.3'
        required: false
        type: string
        default: 'grok-4.7'
      reasoning_effort:
        description: >-
          'low', 'medium', 'high' (xAI's own default) or 'xhigh'; '' omits the
          field. Grok reasoning cannot be disabled, and 'high' takes grok-4.7
          close to the job timeout on a large diff.
        required: false
        type: string
        default: 'medium'
      prompt:
        description: 'Custom review prompt (overrides prompt file if provided)'
        required: false
        type: string
        default: ''
      max_diff_lines:
        description: 'Maximum lines of diff to send to API'
        required: false
        type: number
        default: 10000
      max_diff_bytes:
        description: >-
          Maximum bytes of diff to send to the API, applied after max_diff_lines.
          Sized to the model's context window at three bytes per token, the
          worst case measured on a synthetic diff; code averages about four.
        required: false
        type: number
        default: 1200000
      max_output_tokens:
        description: >-
          Maximum visible output tokens. Reasoning tokens do not count against
          it.
        required: false
        type: number
        default: 16384
      timeout_minutes:
        description: 'Minutes before the review job is cancelled'
        required: false
        type: number
        default: 20
      temperature:
        description: >-
          Sampling temperature as a string, or '' (the default) to omit the
          field.
        required: false
        type: string
        default: ''
    secrets:
      XAI_API_KEY:
        description: 'xAI API key'
        required: true

jobs:
  review:
    if: |
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.draft == false && github.event.pull_request.user.login != 'dependabot[bot]') ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request && (startsWith(github.event.comment.body, '/grok') || startsWith(github.event.comment.body, '/review')) && contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association))
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout_minutes }}
    outputs:
      reported: ${{ steps.post_review.outcome == 'success' || steps.post_error.outcome == 'success' }}
    permissions:
      contents: read
      pull-requests: write

    steps:
      # The prompt file comes from the base branch, never the head: a PR could otherwise rewrite the prompt that reviews it.
      - name: Load prompt
        id: load_prompt
        env:
          GH_TOKEN: ${{ github.token }}
          PROMPT: ${{ inputs.prompt }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
        run: |
          if [ -n "$PROMPT" ]; then
            printf '%s\n' "$PROMPT" > /tmp/prompt.txt
            echo "source=input" >> $GITHUB_OUTPUT
            exit 0
          fi

          BASE_SHA=$(gh pr view "$PR_NUMBER" --repo "$REPO" --json baseRefOid --jq .baseRefOid)
          if gh api -H "Accept: application/vnd.github.raw+json" "repos/$REPO/contents/.github/prompts/ai-review.md?ref=$BASE_SHA" > /tmp/prompt.txt 2> /tmp/prompt_error.txt; then
            echo "source=custom" >> $GITHUB_OUTPUT
          elif grep -q "HTTP 404" /tmp/prompt_error.txt; then
            cat << 'PROMPT_EOF' > /tmp/prompt.txt
          You are a code reviewer. Review ONLY the changes in the pull request diff, not the entire codebase.

          Focus on:
          1. **Security vulnerabilities** - Label by criticality (Critical/High/Medium/Low)
          2. **Bugs** - Logic errors, edge cases, incorrect behavior
          3. **Significant performance issues** - Only flag obvious problems

          Guidelines:
          - Be concise and actionable
          - Reference specific file names and line numbers
          - Only flag real issues, not style preferences
          - If no issues found, say so briefly
          PROMPT_EOF
            echo "source=default" >> $GITHUB_OUTPUT
          else
            cat /tmp/prompt_error.txt
            echo "::error::Could not read .github/prompts/ai-review.md from the base branch"
            exit 1
          fi

      # gh pr diff reads the pulls API, which refuses diffs over 20000 lines; git has no cap.
      - name: Get PR diff
        id: diff
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          MAX_LINES: ${{ inputs.max_diff_lines }}
          MAX_BYTES: ${{ inputs.max_diff_bytes }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
        run: |
          BASE_SHA=$(gh pr view "$PR_NUMBER" --repo "$REPO" --json baseRefOid --jq .baseRefOid)
          HEAD_SHA=$(gh pr view "$PR_NUMBER" --repo "$REPO" --json headRefOid --jq .headRefOid)
          MERGE_BASE=$(gh api "repos/$REPO/compare/$BASE_SHA...$HEAD_SHA" --jq '.merge_base_commit.sha // empty')
          if [ -z "$MERGE_BASE" ]; then
            echo "::error::No merge base between $BASE_SHA and $HEAD_SHA"
            exit 1
          fi
          PR_REPO=$(mktemp -d)
          export GIT_TERMINAL_PROMPT=0
          git init -q "$PR_REPO"
          git -C "$PR_REPO" remote add origin "$GITHUB_SERVER_URL/$REPO.git"
          git -C "$PR_REPO" config credential.helper '!gh auth git-credential'
          git -C "$PR_REPO" fetch -q --filter=blob:none --depth=1 origin "$MERGE_BASE" "$HEAD_SHA"
          git -C "$PR_REPO" diff "$MERGE_BASE" "$HEAD_SHA" > /tmp/pr_diff.txt
          rm -rf "$PR_REPO"

          if [ ! -s /tmp/pr_diff.txt ]; then
            echo "::error::The PR diff is empty"
            exit 1
          fi

          TOTAL_LINES=$(wc -l < /tmp/pr_diff.txt)

          head -n "$MAX_LINES" /tmp/pr_diff.txt > /tmp/pr_diff_lines.txt
          if [ "$(wc -c < /tmp/pr_diff_lines.txt)" -gt "$MAX_BYTES" ]; then
            head -c "$MAX_BYTES" /tmp/pr_diff_lines.txt > /tmp/pr_diff_bytes.txt
            if [ "$(tail -c 1 /tmp/pr_diff_bytes.txt | od -An -c | tr -d ' ')" = '\n' ]; then
              mv /tmp/pr_diff_bytes.txt /tmp/pr_diff_truncated.txt
            else
              sed '$d' /tmp/pr_diff_bytes.txt > /tmp/pr_diff_truncated.txt
            fi
          else
            cp /tmp/pr_diff_lines.txt /tmp/pr_diff_truncated.txt
          fi

          if [ ! -s /tmp/pr_diff_truncated.txt ]; then
            echo "::error::The diff is empty after truncation; raise max_diff_lines or max_diff_bytes"
            exit 1
          fi

          SENT_LINES=$(wc -l < /tmp/pr_diff_truncated.txt)

          if [ "$SENT_LINES" -lt "$TOTAL_LINES" ]; then
            echo "truncated=true" >> "$GITHUB_OUTPUT"
            echo "total_lines=$TOTAL_LINES" >> "$GITHUB_OUTPUT"
            echo "sent_lines=$SENT_LINES" >> "$GITHUB_OUTPUT"
            echo "::warning::Diff truncated from $TOTAL_LINES to $SENT_LINES lines. Some changes were not reviewed."
          else
            echo "truncated=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Call Grok API for review
        id: grok_review
        env:
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          MODEL: ${{ inputs.model }}
          REASONING_EFFORT: ${{ inputs.reasoning_effort }}
          MAX_OUTPUT_TOKENS: ${{ inputs.max_output_tokens }}
          TEMPERATURE: ${{ inputs.temperature }}
        run: |
          SYSTEM_PROMPT=$(cat /tmp/prompt.txt)
          echo "::add-mask::$XAI_API_KEY"

          if [ -z "$XAI_API_KEY" ]; then
            echo "error=true" >> $GITHUB_OUTPUT
            echo "error_message=XAI_API_KEY secret is not set" >> $GITHUB_OUTPUT
            exit 0
          fi

          USER_PROMPT="REPO: ${{ github.repository }}
          PR NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}

          Review this PR diff and provide feedback on any issues found. Be specific about file names and line numbers when possible:"

          jq -n \
            --arg model "$MODEL" \
            --arg system "$SYSTEM_PROMPT" \
            --arg user "$USER_PROMPT" \
            --argjson max_output_tokens "$MAX_OUTPUT_TOKENS" \
            --arg temperature "$TEMPERATURE" \
            --arg reasoning_effort "$REASONING_EFFORT" \
            --rawfile diff /tmp/pr_diff_truncated.txt \
            '{
              model: $model,
              instructions: $system,
              input: [
                { role: "user", content: ($user + "\n\nDiff:\n" + $diff) }
              ],
              max_output_tokens: $max_output_tokens,
              store: false
            }
            + (if $reasoning_effort == "" then {} else { reasoning: { effort: $reasoning_effort } } end)
            + (if $temperature == "" then {} else { temperature: ($temperature | tonumber) } end)' > /tmp/payload.json

          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST "https://api.x.ai/v1/responses" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $XAI_API_KEY" \
            -d @/tmp/payload.json) || {
            CURL_EXIT=$?
            echo "error=true" >> $GITHUB_OUTPUT
            echo "error_message=Grok API request failed: curl exit code $CURL_EXIT" >> $GITHUB_OUTPUT
            exit 0
          }

          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | sed '$d')

          if [ "$HTTP_CODE" != "200" ]; then
            # Newlines would end the GITHUB_OUTPUT line and let the response set further outputs.
            ERROR_DETAIL=$(echo "$BODY" | jq -r 'if (.error | type) == "object" then (.error.message // (.error | tojson)) else (.error // .) end' 2>/dev/null | tr '\n' ' ' | head -c 500)
            echo "error=true" >> $GITHUB_OUTPUT
            echo "error_message=Grok API request failed with status $HTTP_CODE: $ERROR_DETAIL" >> $GITHUB_OUTPUT
            exit 0
          fi

          HAS_ERROR=$(echo "$BODY" | jq -e '.error != null' > /dev/null 2>&1 && echo "yes" || echo "no")
          if [ "$HAS_ERROR" = "yes" ]; then
            ERROR_DETAIL=$(echo "$BODY" | jq -r 'if (.error | type) == "object" then (.error.message // (.error | tojson)) else .error end' 2>/dev/null | tr '\n' ' ' | head -c 500)
            echo "error=true" >> $GITHUB_OUTPUT
            echo "error_message=Grok API returned an error response: $ERROR_DETAIL" >> $GITHUB_OUTPUT
            exit 0
          fi

          STATUS=$(echo "$BODY" | jq -r '.status // "unknown"' | tr -d '\n\r')
          if [ "$STATUS" != "completed" ]; then
            INCOMPLETE=$(echo "$BODY" | jq -r '.incomplete_details.reason // "none"' | tr -d '\n\r')
            echo "error=true" >> $GITHUB_OUTPUT
            echo "error_message=Grok response status is $STATUS (incomplete reason: $INCOMPLETE). Raise max_output_tokens or lower reasoning_effort." >> $GITHUB_OUTPUT
            exit 0
          fi

          REVIEW=$(echo "$BODY" | jq -r '[.output[]? | select(.type == "message") | .content[]? | select(.type == "output_text") | .text] | join("\n")')

          if [ -z "$(printf '%s' "$REVIEW" | tr -d '[:space:]')" ]; then
            echo "error=true" >> $GITHUB_OUTPUT
            echo "error_message=Grok returned no output text although the response completed." >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "$REVIEW" > /tmp/review.txt
          echo "success=true" >> $GITHUB_OUTPUT

      - name: Post review comment
        id: post_review
        if: steps.grok_review.outputs.success == 'true'
        uses: actions/github-script@v7
        env:
          TRUNCATED: ${{ steps.diff.outputs.truncated }}
          TOTAL_LINES: ${{ steps.diff.outputs.total_lines }}
          SENT_LINES: ${{ steps.diff.outputs.sent_lines }}
          PROMPT_SOURCE: ${{ steps.load_prompt.outputs.source }}
          MODEL: ${{ inputs.model }}
        with:
          script: |
            const fs = require('fs');
            const raw = fs.readFileSync('/tmp/review.txt', 'utf8');
            const limit = 60000;
            const review = raw.length > limit ? raw.slice(0, limit) + "\n\n> Review truncated to fit GitHub's comment size limit." : raw;
            const truncated = process.env.TRUNCATED === 'true';
            const totalLines = process.env.TOTAL_LINES;
            const sentLines = process.env.SENT_LINES;
            const promptSource = process.env.PROMPT_SOURCE;
            const model = process.env.MODEL;

            let truncationWarning = '';
            if (truncated) {
              truncationWarning = `\n> ⚠️ **Warning:** Diff was truncated from ${totalLines} to ${sentLines} lines. Some changes were not reviewed.\n`;
            }

            let promptNote = promptSource === 'custom' ? ' · custom prompt' : '';

            if (review && review.trim() !== '') {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: `## 🤖 Grok Code Review\n${truncationWarning}\n${review}\n\n---\n*Automated review by Grok (xAI) · ${model}${promptNote}*`
              });
            }

      - name: Post error comment
        id: post_error
        if: steps.grok_review.outputs.error == 'true'
        uses: actions/github-script@v7
        env:
          ERROR_MESSAGE: ${{ steps.grok_review.outputs.error_message }}
        with:
          script: |
            const errorMessage = process.env.ERROR_MESSAGE || 'Unknown error';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `## 🤖 Grok Code Review\n\n⚠️ Review failed: ${errorMessage}\n\n---\n*Automated review by Grok (xAI)*`
            });

      - name: Fail the job if the review did not run
        if: steps.grok_review.outputs.error == 'true'
        env:
          # Built from an API response: must reach the shell only through env, never interpolated into run.
          ERROR_MESSAGE: ${{ steps.grok_review.outputs.error_message }}
        run: |
          echo "::error::${ERROR_MESSAGE//%/%25}"
          exit 1

  # always() also runs this when review was skipped (fork PRs, other slash commands), so skipped must be excluded.
  report_failure:
    name: Report review failure
    needs: review
    if: ${{ always() && needs.review.result != 'skipped' && needs.review.outputs.reported != 'true' }}
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: actions/github-script@v7
        env:
          RESULT: ${{ needs.review.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          github-token: ${{ github.token }}
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request?.number || context.payload.issue?.number,
              body: `## 🤖 Grok Code Review\n\n⚠️ The review job did not complete (result: ${process.env.RESULT}). [See the job log](${process.env.RUN_URL})\n\n---\n*Automated review by Grok (xAI)*`,
            });
