name: AI Code Review

on:
  pull_request:
    types: [opened, reopened, ready_for_review]
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write

jobs:
  claude-big:
    if: github.event_name == 'pull_request' && github.event.pull_request.draft == false
    uses: ./.github/workflows/ai-review-claude-api.yml
    with:
      max_diff_lines: 200000
      timeout_minutes: 30
    secrets:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

  gemini-big:
    if: github.event_name == 'pull_request' && github.event.pull_request.draft == false
    uses: ./.github/workflows/ai-review-gemini.yml
    with:
      max_diff_lines: 200000
      timeout_minutes: 30
    secrets:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

  claude-bogus-key:
    if: github.event_name == 'pull_request' && github.event.pull_request.draft == false
    uses: ./.github/workflows/ai-review-claude-api.yml
    with:
      max_diff_lines: 200000
    secrets:
      ANTHROPIC_API_KEY: ${{ 'bogus-key' }}

  gemini-timeout:
    if: github.event_name == 'pull_request' && github.event.pull_request.draft == false
    uses: ./.github/workflows/ai-review-gemini.yml
    with:
      max_diff_lines: 200000
      timeout_minutes: 1
    secrets:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
