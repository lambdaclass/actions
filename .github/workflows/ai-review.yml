name: AI Code Review

on:
  pull_request:
    types: [opened, reopened, ready_for_review]
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write

jobs:
  gemini-review:
    if: >
      (github.event_name == 'pull_request' && github.event.pull_request.draft == false &&
      github.event.pull_request.user.login != 'dependabot[bot]') ||
      (github.event_name == 'issue_comment' && startsWith(github.event.comment.body, '/gemini'))
    uses: ./.github/workflows/ai-review-gemini.yml
    with:
      max_diff_bytes: 600000
      timeout_minutes: 30
    secrets:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

  gemini-overflow:
    if: >
      (github.event_name == 'pull_request' && github.event.pull_request.draft == false &&
      github.event.pull_request.user.login != 'dependabot[bot]') ||
      (github.event_name == 'issue_comment' && startsWith(github.event.comment.body, '/gemini'))
    uses: ./.github/workflows/ai-review-gemini.yml
    with:
      max_diff_bytes: 4000000
      timeout_minutes: 30
    secrets:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
